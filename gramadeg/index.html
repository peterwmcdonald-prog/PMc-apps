$('quitBtn').onclick=()=>{ if(confirm('Quit this lesson? Answers so far are kept.')) leaveLesson(); };

/* ================= question rendering ================= */
function speaker(html, mood='happy'){ return `<div class="speaker">${mascot(mood,'m')}<div class="sb">${html}</div></div>`; }
function blankify(s){ return esc(s).replace('___','<span class="blank">&nbsp;</span>'); }
function next(){
  if(!L.queue.length) return finish();
  L.cur=L.queue.shift(); L.state='answer'; L.answer=null; L.t0=performance.now();
  const {q,retry}=L.cur; L.cur.hard=challenge(q,retry); if(!retry) L.asked.push(q.id);
  $('progFill').style.width=(L.done/L.total*100)+'%';
  $('combo').innerHTML = L.combo>=3 ? icon('flame')+L.combo : '';
  $('lfoot').className='lfoot';
  const cb=$('checkBtn'); cb.textContent='Check'; cb.className='btn'; cb.disabled=true;
  const u=unitOf(q.unit);
  let h = retry ? `<div class="qkicker again">${icon('repeat')} Previous mistake</div>`
    : L.cur.probe ? `<div class="qkicker again">${icon('target')} Follow-up: ${esc(skillInfo(L.cur.probe).title)}</div>`
    : `<div class="qkicker" style="color:${u.colour}">${icon(u.icon)} ${esc(u.title)}${L.cur.hard&&L.mode!=='place'&&L.mode!=='testout'?' · <span style="color:var(--orange)">Challenge</span>':''}</div>`;
  if(q.type==='mc' && L.cur.hard){
    const gap=q.prompt.includes('___');
    h+=`<div class="qtitle">${gap?'Type the missing word':'Type it in Welsh'}</div>${speaker((gap?blankify(q.prompt):esc(q.prompt))+(q.en&&gap?`<small>${esc(q.en)}</small>`:''),'think')}`;
    h+=`<input class="typein" id="typein" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer (accents optional)">`;
    $('qwrap').innerHTML=h;
    const inp=$('typein');
    inp.oninput=()=>{ L.answer=inp.value; $('checkBtn').disabled=!inp.value.trim(); };
    inp.onkeydown=e=>{ if(e.key==='Enter' && inp.value.trim()) $('checkBtn').click(); };
    setTimeout(()=>inp.focus(),60);
  }
  else if(q.type==='mc'){
    const order=shuffle(q.options.map((o,i)=>i));
    h+=`<div class="qtitle">Choose the correct answer</div>${speaker(blankify(q.prompt)+(q.en?`<small>${esc(q.en)}</small>`:''))}<div class="opts">`;
    order.forEach((i,n)=>{ h+=`<button class="opt" data-i="${i}"><span class="k">${n+1}</span><span>${esc(q.options[i])}</span></button>`; });
    h+=`</div>`;
    $('qwrap').innerHTML=h;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(L.state!=='answer')return; document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); L.answer=+b.dataset.i; $('checkBtn').disabled=false; });
  }
  else if(q.type==='tiles'){
    const toks=q.answer.split(' ');
    L.tiles={bank:shuffle(toks.concat(q.distractors||[]).map((t,i)=>({t,i}))), picked:[]};
    h+=`<div class="qtitle">Translate this sentence</div>${speaker(esc(q.en))}<div class="answer-line" id="aline"></div><div class="bank" id="bank"></div>`;
    $('qwrap').innerHTML=h; drawTiles();
  }
  else if(q.type==='type'){
    h+=`<div class="qtitle">Fill the gap</div>${speaker(blankify(q.text)+(q.en?`<small>${esc(q.en)}</small>`:''),'think')}`;
    if(q.hint) h+=`<div class="hint">Base word / clue: <b>${esc(q.hint)}</b></div>`;
    h+=`<input class="typein" id="typein" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing word (accents optional)">`;
    $('qwrap').innerHTML=h;
    const inp=$('typein');
    inp.oninput=()=>{ L.answer=inp.value; $('checkBtn').disabled=!inp.value.trim(); };
    inp.onkeydown=e=>{ if(e.key==='Enter' && inp.value.trim()) $('checkBtn').click(); };
    setTimeout(()=>inp.focus(),60);
  }
  else if(q.type==='error'){
    h+=`<div class="qtitle">Tap the word that's wrong</div><div class="chips">${q.sentence.split(' ').map((t,i)=>`<button class="chip" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
    $('qwrap').innerHTML=h;
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if(L.state!=='answer')return; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); L.answer=+b.dataset.i; $('checkBtn').disabled=false; });
  }
  $('qwrap').scrollTop=0;
}
function drawTiles(){
  const {bank,picked}=L.tiles;
  $('aline').innerHTML=picked.map((b,k)=>`<button class="tile" data-k="${k}">${esc(b.t)}</button>`).join('');
  $('bank').innerHTML=bank.map((b,k)=>{ const used=picked.includes(b); return `<button class="tile${used?' used':''}" data-k="${k}" ${used?'disabled':''}>${esc(b.t)}</button>`; }).join('');
  $('aline').querySelectorAll('.tile').forEach(el=>el.onclick=()=>{ if(L.state!=='answer')return; picked.splice(+el.dataset.k,1); drawTiles(); });
  $('bank').querySelectorAll('.tile').forEach(el=>el.onclick=()=>{ if(L.state!=='answer')return; picked.push(bank[+el.dataset.k]); drawTiles(); });
  L.answer=picked.map(b=>b.t).join(' ');
  $('checkBtn').disabled=!picked.length;
}

/* ================= checking ================= */
function correctText(q){ return q.type==='mc'?q.options[q.answer] : q.type==='tiles'?q.answer : q.type==='type'?q.text.replace('___',q.answer) : q.fix; }
const ECHO=new Set(['i','e','fe','fo','hi','ni','chi','nhw']);
function grade(q){
  if(q.type==='mc' && L.cur.hard){ const a=norm(L.answer||''), t=norm(q.options[q.answer]), w=t.split(' ');
    return a===t || (w.length>=3 && ECHO.has(w[w.length-1]) && a===w.slice(0,-1).join(' ')); }
  if(q.type==='mc') return L.answer===q.answer;
  if(q.type==='error') return L.answer===q.wrong;
  const a=norm(L.answer||''); return [q.answer].concat(q.alts||[]).some(x=>norm(x)===a);
}
function givenText(q){ if(L.answer==null) return ''; if(q.type==='mc'&&L.cur.hard) return String(L.answer); if(q.type==='mc') return q.options[L.answer]; if(q.type==='error') return q.sentence.split(' ')[L.answer]; return String(L.answer); }
$('checkBtn').onclick=()=>{
  if(L.state==='feedback'){ if(L.cur.ok) L.done++; next(); return; }
  const {q,retry}=L.cur, ok=grade(q), ms=Math.round(performance.now()-L.t0);
  logAnswer(q, ok, ms, givenText(q), retry); if(retry) save();
  L.cur.ok=ok; L.state='feedback';
  if(q.type==='mc'&&!L.cur.hard) document.querySelectorAll('.opt').forEach(b=>{ const i=+b.dataset.i; b.classList.remove('sel'); if(i===q.answer) b.classList.add('right'); else if(i===L.answer) b.classList.add('wrongsel'); });
  if(q.type==='error') document.querySelectorAll('.chip').forEach(b=>{ const i=+b.dataset.i; b.classList.remove('sel'); if(i===q.wrong) b.classList.add('right'); else if(i===L.answer) b.classList.add('wrongsel'); });
  if(q.type==='type'||L.cur.hard){ const inp=$('typein'); inp.disabled=true; inp.classList.add(ok?'right':'wrong'); }
  if(!retry){
    const x=item(q.id), fresh=!x.seen; x.seen++; L.firstTotal++;
    (L.res||(L.res={}))[q.unit]=L.res[q.unit]||{n:0,ok:0}; L.res[q.unit].n++; if(ok) L.res[q.unit].ok++;
    if(ok){ x.right=(x.right||0)+1; x.box=Math.min(fresh?(L.cur.hard||q.type==='type'?3:2):x.box+(L.cur.hard?2:1),INTERVALS.length-1); if(L.mode==='place'||L.mode==='testout') x.box=Math.max(x.box,3); x.due=addDays(today(),INTERVALS[x.box]); L.firstRight++; addXp(1); L.xp++; }
    else { x.wrong=(x.wrong||0)+1; x.ft=0; x.box=0; x.due=today(); x.lastWrong=today(); L.missed.push(q); followUp(q); }
    save();
  }
  if(ok){ L.combo++; L.best=Math.max(L.best,L.combo); } else { L.combo=0; L.queue.push({q,retry:true}); }
  $('combo').innerHTML = L.combo>=3 ? icon('flame')+L.combo : '';
  sfx(ok?'ok':'bad');
  if(!ok) $('qwrap').classList.add('shake'), setTimeout(()=>$('qwrap').classList.remove('shake'),400);
  $('lfoot').className='lfoot '+(ok?'right':'wrong');
  $('fbBadge').innerHTML=icon(ok?'check':'cross');
  $('fbTitle').textContent= ok ? (L.combo>=5?`${L.combo} in a row!`:praise()) : 'Correct answer:';
  $('fbAns').textContent= ok ? (q.type==='error'?q.fix:'') : correctText(q);
  $('fbExp').textContent=q.explain||'';
  $('ruleBtn').innerHTML=icon('book')+'Rule'; $('ruleBtn').onclick=()=>openRule(q.unit);
  $('flagBtn').innerHTML=icon('flag')+'Flag';
  const cb=$('checkBtn'); cb.textContent='Continue'; cb.className='btn'+(ok?'':' red');
};
function praise(){ const p=['Da iawn!','Gwych!','Ardderchog!','Bendigedig!','Cywir!','Campus!']; return p[Math.floor(Math.random()*p.length)]; }
$('flagBtn').onclick=()=>{
  const q=L.cur.q; const note=prompt('What looks wrong with '+q.id+'? (optional)'); if(note===null) return;
  S.flags.push({id:q.id, note:note.trim(), given:givenText(q), at:today()}); save(); toast('Flagged '+q.id);
};

/* ================= finish ================= */
function finish(){
  $('progFill').style.width='100%';
  const bonus = 5 + (L.firstTotal && L.firstRight===L.firstTotal ? 5 : 0);
  addXp(bonus); L.xp+=bonus;
  const t=today(); if(S.streak.last!==t){ S.streak.n=(S.streak.last===addDays(t,-1))?S.streak.n+1:1; S.streak.last=t; }
  save(); if(L.mode!=='place'&&L.mode!=='testout') driveSave(false);
  const acc=L.firstTotal?Math.round(L.firstRight/L.firstTotal*100):100;
  $('doneMascot').innerHTML=mascot('cheer','m');
  $('doneTitle').textContent= acc===100?'Perffaith!': acc>=80?'Da iawn!':'Lesson complete!';
  countUp($('dXp'), L.xp, icon('bolt'));
  countUp($('dAcc'), acc, '', '%');
  $('dStreak').innerHTML=icon('flame')+S.streak.n;
  $('recap').innerHTML = L.missed.length ? `<h3>Your mistakes this time</h3>`+L.missed.map(q=>`<div>${esc(qText(q))}<br><b>${esc(correctText(q))}</b></div>`).join('')+`<p style="font-size:13px;color:var(--dim);margin:6px 2px 0">These are now in Practice → Fix mistakes.</p>` : '';
  if(L.mode==='place'||L.mode==='testout'){
    const rows=Object.keys(L.res||{}).map(uid=>{ const u=unitOf(uid), r=L.res[uid];
      const pass = L.mode==='place' ? r.ok===r.n : r.ok>=r.n-1 && r.ok/r.n>=0.85;
      const n = pass ? fastTrack(u) : 0; return {u,r,pass,n}; });
    if(L.mode==='place') S.placed=today(); save(); driveSave(false);
    const first=rows.find(x=>!x.pass);
    $('recap').innerHTML = `<h3>${L.mode==='place'?'Placement results':'Test-out result'}</h3>`+rows.map(x=>`<div><b>${esc(x.u.title)}</b> ${x.r.ok}/${x.r.n} – ${x.pass?`<span style="color:var(--green-d,#46A302)">fast-tracked</span> (${x.n} questions credited, spot-checked over the next 2 weeks)`:'<span style="color:var(--red-d)">work through this unit</span>'}</div>`).join('')
      + (first?`<p style="font-size:14px;margin:12px 2px 0">Start with <b>${esc(first.u.title)}</b>. Wrong answers are in Practice → Fix mistakes.</p>`:'');
  }
  const focus=Object.values(model().K).filter(k=>k.verdict==='weak'||k.verdict==='shaky').sort((a,b)=>a.mastery-b.mastery)[0];
  if(focus) $('recap').innerHTML+=`<p style="font-size:14px;margin:12px 2px 0">Next focus: <b style="color:var(--red-d)">${esc(focus.info.title)}</b> (${Math.round(focus.mastery*100)}%). See Insights.</p>`;
  show('done'); sfx('done'); confetti();
}
function countUp(el, to, pre='', post=''){ let n=0; const step=Math.max(1,Math.ceil(to/20)); const t=setInterval(()=>{ n=Math.min(to,n+step); el.innerHTML=pre+n+post; if(n>=to) clearInterval(t); },35); }
$('doneBtn').onclick=()=>{ cancelAnimationFrame(CONF); const cv=$('confetti'); cv.width=cv.width; leaveLesson(); };
let CONF=0;
function confetti(){ cancelAnimationFrame(CONF);
  const cv=$('confetti'), cx=cv.getContext('2d'); cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); const t0=performance.now();
  const cols=['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#CE82FF','#FF9600'];
  const ps=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0; (function tick(){ cx.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va; cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();}); if(performance.now()-t0<2200 && ++f<400) CONF=requestAnimationFrame(tick); else cx.clearRect(0,0,innerWidth,innerHeight); })();
}

/* ================= Google Drive backup ================= */
// Daily: the first time the app is opened or brought back to the front each day, it saves to Drive.
// Also after every lesson. The Drive script keeps one dated file per day plus a "latest" copy.
const DKEY='gramadeg-drive', SCRIPT_URL='../tools/drive-backup.gs';
let DRIVE_BUSY=false, SCRIPT_TEXT='';
function driveCfg(){ try{ const d=JSON.parse(localStorage.getItem(DKEY)); return d&&typeof d==='object'?d:{}; }catch(e){ return {}; } }
function setDrive(o){ try{ localStorage.setItem(DKEY, JSON.stringify(Object.assign(driveCfg(),o))); }catch(e){} }
function timed(url, opts, ms=25000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return fetch(url, Object.assign({signal:c.signal},opts||{})).finally(()=>clearTimeout(t)); }
const settingsOpen = () => $('overlay').classList.contains('on') && !!$('sheet').querySelector('[data-settings]');
async function driveSave(manual){
  const d=driveCfg(); if(!d.url){ if(manual) toast('Connect Google Drive first'); return false; }
  if(DRIVE_BUSY) return false; DRIVE_BUSY=true;
  if(manual) toast('Saving…');
  try{
    const r=await timed(d.url+'?app=gramadeg',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S)});
    const j=await r.json(); if(!j||!j.ok) throw 0;
    setDrive({last:new Date().toISOString(), lastDay:today(), err:null});
    if(manual) toast('Saved to Google Drive');
    return true;
  }catch(e){
    setDrive({err:new Date().toISOString()});
    if(manual) toast('Drive save failed – check signal and try again');
    return false;
  }finally{ DRIVE_BUSY=false; if(settingsOpen()) openSettings(); }
}
async function driveLoad(url){ const r=await timed(url+'?app=gramadeg'); const j=await r.json(); if(!j||!j.ok) throw 0; return j.data; }
const seenCount = st => Object.values((st&&st.items)||{}).filter(x=>x&&x.seen).length;
async function driveConnect(){
  const url=(($('driveUrl')||{}).value||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s/]+\/exec$/.test(url)){ toast('Paste the Web app link ending in /exec'); return; }
  toast('Connecting…');
  let remote=null; try{ remote=await driveLoad(url); }catch(e){ toast('Could not reach the script – check step 4'); return; }
  setDrive({url});
  if(remote && remote.items && seenCount(remote)>seenCount(S) && confirm('Drive has more progress than this phone ('+seenCount(remote)+' vs '+seenCount(S)+' questions seen). Restore it?')){
    S=clean(remote); save(); renderTab(); toast('Restored from Drive');
  } else if(await driveSave(false)) toast('Connected – first backup saved');
  else toast('Connected, but first save failed');
  if(settingsOpen()) openSettings();
}
async function driveRestore(){
  const d=driveCfg(); if(!d.url) return;
  try{ const remote=await driveLoad(d.url); if(!remote||!remote.items){ toast('No backup on Drive yet'); return; }
    if(!confirm('Replace progress on this phone with the Drive copy ('+seenCount(remote)+' questions seen)?')) return;
    S=clean(remote); save(); closeSheet(); renderTab(); toast('Restored from Drive');
  }catch(e){ toast('Could not reach Drive'); }
}
function driveDisconnect(){ if(confirm('Stop saving to Google Drive? Files already in Drive are kept.')){ try{localStorage.removeItem(DKEY);}catch(e){} openSettings(); } }
function driveDaily(){ const d=driveCfg(); if(d.url && d.lastDay!==today() && navigator.onLine!==false) driveSave(false); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ driveDaily(); if(C && document.querySelector('#home.on')) renderTop(); } });
window.addEventListener('online', driveDaily);
// Time away from the app doesn't count towards answer speed.
let HIDDEN_AT=0; document.addEventListener('visibilitychange', ()=>{ if(document.hidden) HIDDEN_AT=performance.now(); else if(HIDDEN_AT){ if(L&&L.t0) L.t0+=performance.now()-HIDDEN_AT; HIDDEN_AT=0; } });
function loadScriptText(){ if(SCRIPT_TEXT) return; timed(SCRIPT_URL,{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{ SCRIPT_TEXT=t; const ta=$('scriptBox'); if(ta) ta.value=t; }).catch(()=>{}); }
function copyScript(){
  const ta=$('scriptBox'); if(!SCRIPT_TEXT||!ta){ toast('Script still loading – try again'); loadScriptText(); return; }
  const done=()=>toast('Script copied'), fall=()=>{ ta.focus(); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Select the text and copy it'); } };
  if(navigator.clipboard) navigator.clipboard.writeText(SCRIPT_TEXT).then(done, fall); else fall();
}
function driveSetupHtml(){
  loadScriptText();
  return `<p>Off. One-off setup, about 5 minutes. Easiest on a laptop.</p>
  <ol class="steps">
    <li>Copy the backup script: <button class="btn sm blue" onclick="copyScript()">Copy script</button>
      <textarea id="scriptBox" readonly>${esc(SCRIPT_TEXT||'Loading…')}</textarea></li>
    <li>Go to <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">script.google.com</a> (signed in to your Google account). A new project opens. Delete the code in it, paste the script, and press the save icon.</li>
    <li>Top right: <b>Deploy → New deployment</b>. Click the cog next to “Select type” and choose <b>Web app</b>. Set <b>Execute as: Me</b> and <b>Who has access: Anyone</b>. Press <b>Deploy</b>.</li>
    <li>Google asks for permission: <b>Authorise access</b> → pick your account → <b>Advanced</b> → <b>Go to … (unsafe)</b> → <b>Allow</b>. (It says “unsafe” only because you wrote the script yourself.)</li>
    <li>Copy the <b>Web app URL</b> (ends in <code>/exec</code>), paste it below and press Connect.</li>
  </ol>
  <p style="font-size:13px">The link is private to you; anyone holding it could only read or overwrite this grammar progress. Files go to Drive → Welsh → Gramadeg backups, one per day.</p>
  <input class="typein" id="driveUrl" style="font-size:15px" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn blue" onclick="driveConnect()">Connect</button>`;
}

/* ================= settings ================= */
function flagText(){ return S.flags.map(f=>`${f.id}${f.given?` [I said: ${f.given}]`:''}${f.note?` – ${f.note}`:''}`).join('\n'); }
const fmtWhen = iso => { try{ return new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } };
function openSettings(){
  const ft=flagText(), d=driveCfg();
  const failedLast = d.err && (!d.last || d.err>d.last);
  openSheet('Settings', `<span data-settings></span><div class="sub">Progress is saved on this phone${d.url?' and backed up to Google Drive daily and after every lesson':''}.</div>
  <div class="setrow"><b>${icon('cloud','style="width:18px;height:18px;vertical-align:-3px"')} Google Drive backup</b>${d.url
    ? `<p>On. Saves to Drive → Welsh → Gramadeg backups each day you open the app, and after every lesson.<br>Last saved: <b>${d.last?fmtWhen(d.last):'not yet'}</b>${failedLast?`<br><span class="warn">Last attempt failed (${fmtWhen(d.err)}). It will retry next time you open the app.</span>`:''}</p>
      <button class="btn blue" onclick="driveSave(true)">Save now</button><button class="btn ghost" onclick="driveRestore()">Restore from Drive</button><button class="btn ghost" onclick="driveDisconnect()">Disconnect</button>`
    : driveSetupHtml()}</div>
  <div class="setrow"><b>Flagged questions (${S.flags.length})</b><p>Copy these and paste them to Claude to fix.</p>
    ${S.flags.length?`<div class="flaglist">${esc(ft)}</div><button class="btn blue" onclick="copyFlags()">Copy flags</button><button class="btn ghost" onclick="clearFlags()">Clear flags</button>`:''}</div>
  <div class="setrow"><b>Sound</b><button class="btn ghost" onclick="S.sound=!S.sound;save();openSettings()">${S.sound?'On: tap to mute':'Off: tap to unmute'}</button></div>
  <div class="setrow"><b>Backup file</b><p>Save your progress as a file, or restore one.</p>
    <button class="btn blue" onclick="exportData()">Export backup</button><button class="btn ghost" onclick="$('importFile').click()">Import backup</button></div>
  <div class="setrow"><b>Content</b><p>Version ${esc(C?C.version:'–')} · ${C?allQs().length:0} questions in ${C?built().length:0} units</p><a class="btn ghost" style="text-decoration:none" href="review.html">Open content review</a></div>
  <div class="setrow"><b>Reset</b><button class="btn red" onclick="resetAll()">Reset all progress</button></div>
  <button class="btn ghost" onclick="closeSheet()">Back</button>`);
}
$('setBtn').innerHTML=icon('gear'); $('setBtn').onclick=openSettings;
function copyFlags(){ const t=flagText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>toast('Copy failed – select and copy the text')); }
function clearFlags(){ if(confirm('Clear all flags?')){ S.flags=[]; save(); openSettings(); } }
async function exportData(){
  const name='gramadeg-backup-'+today()+'.json', text=JSON.stringify(S,null,1);
  // On a phone, use the share sheet (Save to Files / Drive). Opening the file directly can strand you outside the app.
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('importFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t); if(!d||typeof d!=='object'||!d.items||typeof d.items!=='object') throw 0;
    const n=seenCount(d); if(!confirm('Replace progress on this phone with this file ('+n+' questions seen)?')) return;
    S=clean(d); save(); closeSheet(); renderTab(); toast('Backup restored'); driveSave(false);
  }).catch(()=>toast('Not a valid Gramadeg backup')); };
function resetAll(){ if(confirm('Delete all progress? This cannot be undone.')){ S=blank(); save(); closeSheet(); renderTab(); } }

/* ================= boot ================= */
$('brandMascot').innerHTML=mascot('happy','mini');
renderNav();
driveDaily();
function loadContent(){
  $('tab-learn').innerHTML='<p style="text-align:center;color:var(--dim);margin-top:40px">Loading…</p>';
  timed('content.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{ if(!d||!Array.isArray(d.units)||!Array.isArray(d.sections)) throw 0; C=d; renderTab(); })
    .catch(()=>{ $('tab-learn').innerHTML='<p style="text-align:center;margin-top:40px">Could not load the questions.</p><button class="btn" onclick="loadContent()">Try again</button>'; });
}
loadContent();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
