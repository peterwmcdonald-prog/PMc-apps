<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gramadeg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<title>Gramadeg</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#3C3C3C; --ink2:#4B4B4B; --dim:#777777; --dimmer:#AFAFAF; --line:#E5E5E5; --soft:#F7F7F7;
  --green:#58CC02; --green-d:#58A700; --green-bg:#D7FFB8;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-bg:#FFDFE0;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-bg:#DDF4FF; --blue-line:#84D8FF;
  --orange:#FF9600; --orange-d:#E08600; --gold:#FFC800; --gold-d:#E5A500; --purple:#CE82FF;
  --dragon:#E8453C;
  --r:16px; --nav:72px;
  --safe-b: env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:700;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top)}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{display:none;max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh}
.screen.on{display:flex;flex-direction:column}
.h-title{font-family:'Baloo 2',sans-serif;font-weight:800;letter-spacing:-.2px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r);padding:14px 16px 15px;font-weight:900;font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--dimmer);box-shadow:0 4px 0 #D4D4D4}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.red:active{box-shadow:0 0 0 var(--red-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{box-shadow:0 0 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.sm{width:auto;padding:9px 14px 10px;font-size:13px;border-radius:12px}
.iconbtn{background:none;border:0;padding:6px;color:var(--dimmer);display:grid;place-items:center}
.iconbtn svg.i{width:26px;height:26px}

/* top bar */
.top{position:sticky;top:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:23px;color:var(--dragon)}
.brand .mini{width:34px;height:34px}
.stats-row{display:flex;gap:12px;align-items:center}
.stat-pill{font-weight:900;font-size:16px;display:flex;align-items:center;gap:3px}
.stat-pill svg{width:22px;height:22px}
.stat-pill.flame{color:var(--orange)} .stat-pill.flame.off{color:var(--dimmer)}
.stat-pill.xp{color:var(--blue)}
.goal{position:relative;width:30px;height:30px}
.goal svg{width:30px;height:30px}
.goal b{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--dim)}

/* tabs */
.tab{display:none;padding:16px 16px calc(var(--nav) + 30px + var(--safe-b))}
.tab.on{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:15;background:#fff;border-top:2px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center}
.nav-in{display:flex;width:100%;max-width:600px;justify-content:space-around}
.nav button{flex:1;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dimmer);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;max-width:96px}
.nav button svg.i{width:28px;height:28px}
.nav button.on{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-line)}

/* learn path */
.unit-banner{position:relative;border-radius:var(--r);color:#fff;padding:14px 14px 14px 16px;margin:4px 0 22px;display:flex;align-items:center;gap:12px;overflow:hidden}
.unit-banner::after{content:'';position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.unit-banner .meta{flex:1;position:relative;z-index:1}
.unit-banner .kicker{font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.unit-banner .t{font-family:'Baloo 2';font-weight:800;font-size:21px;line-height:1.1;margin:2px 0}
.unit-banner .s{font-size:14px;opacity:.92}
.unit-banner .guide{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid rgba(255,255,255,.4);border-bottom-width:4px;background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:8px 10px 6px;font-weight:900;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;margin:0 0 40px;padding-top:40px;min-height:100px}
.node{position:relative;width:80px;height:80px;display:grid;place-items:center}
.node .ring{position:absolute;inset:-9px;width:98px;height:98px}
.node button{position:relative;z-index:1;width:70px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;transition:transform .06s}
.node button svg.i{width:32px;height:32px;stroke-width:3}
.node button:active{transform:translateY(6px)}
.node.trophy button{border-radius:22px;width:64px}
.node .startbubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;letter-spacing:.6px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:2}
.node .startbubble::after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.path .deco{position:absolute;top:50%;margin-top:-30px;width:104px;height:104px;pointer-events:none}
.path .deco.l{left:0} .path .deco.r{right:0}
.coming{margin-top:10px;border-top:2px solid var(--line);padding-top:18px}
.coming h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:0 0 8px}
.soon-row{display:flex;align-items:center;gap:12px;padding:10px 2px}
.soon-row .lk{width:46px;height:42px;border-radius:50%;background:var(--line);box-shadow:0 5px 0 #D0D0D0;display:grid;place-items:center;color:var(--dimmer)}
.soon-row b{display:block;color:#9A9A9A;font-size:15px}
.soon-row span{font-size:13px;color:var(--dimmer)}

/* cards */
.card{border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;background:#fff}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hero svg.m{width:86px;height:86px;flex:none}
.hero .say{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35;color:var(--ink2)}
.hero .say::before{content:'';position:absolute;left:-8px;top:24px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:#fff;color:var(--ink)}
.mode:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:15px}
.mode .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.mode .ic svg.i{width:28px;height:28px;stroke-width:2.6}
.mode .tx{flex:1}
.mode b{display:block;font-size:17px;font-weight:900}
.mode span{display:block;font-size:13.5px;color:var(--dim);line-height:1.3;margin-top:2px}
.mode .count{font-family:'Baloo 2';font-size:22px;font-weight:800;min-width:30px;text-align:right}
.mode.disabled{opacity:.5}
.sec-h{font-size:13px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 10px}
.weak{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.weak:last-child{border-bottom:0}
.weak .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.weak .dot svg.i{width:20px;height:20px}
.weak .mid{flex:1;min-width:0}
.weak .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.weak .num{font-size:12px;color:var(--dim);margin-top:3px}
.missed{padding:10px 0;border-bottom:2px solid var(--line);font-size:14.5px}
.missed:last-child{border-bottom:0}
.missed .q{color:var(--ink2)}
.missed .a{color:var(--green-d);font-weight:900}
.missed .n{float:right;color:var(--red-d);font-weight:900;font-size:13px}

.nav button{max-width:84px;letter-spacing:.2px;font-size:10.5px}
/* insights */
.vchip{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.vchip.weak{background:var(--red-bg);color:var(--red-d)} .vchip.shaky{background:#FFF0D5;color:var(--orange-d)}
.vchip.solid{background:var(--green-bg);color:var(--green-d)} .vchip.nodata{background:var(--soft);color:var(--dimmer)}
.sk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.sk:last-child{border-bottom:0}
.sk .mid{flex:1;min-width:0}
.sk .mid b{display:block;font-size:15px;line-height:1.2}
.sk .mid small{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.3}
.sk .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumgrid div{background:var(--soft);border-radius:12px;padding:10px}
.sumgrid b{display:block;font-family:'Baloo 2';font-size:22px;line-height:1}
.sumgrid span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.solidwrap{display:flex;flex-wrap:wrap;gap:6px}
.conf{padding:9px 0;border-bottom:2px solid var(--line);font-size:14px}
.conf:last-child{border-bottom:0}
.conf .x{color:var(--red-d);font-weight:900} .conf .y{color:var(--green-d);font-weight:900}
.conf .n{float:right;color:var(--red-d);font-weight:900;font-size:13px}
.trow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.note{font-size:13px;color:var(--dim);line-height:1.4;margin:6px 2px 0}
/* map */
.overall{display:flex;align-items:center;gap:16px}
.overall .big{position:relative;width:96px;height:96px;flex:none}
.overall .big svg{width:96px;height:96px}
.overall .big b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Baloo 2';font-size:24px;font-weight:800;color:var(--green-d)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.kv div{background:var(--soft);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-family:'Baloo 2';font-size:20px;line-height:1}
.kv span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--dim);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tree{position:relative;margin-top:8px}
.tsec{position:relative;margin-bottom:6px}
.tsec .root{display:flex;align-items:center;gap:10px;padding:8px 0}
.tsec .root .badge{width:40px;height:40px;border-radius:12px;background:var(--ink2);color:#fff;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:18px}
.tsec .root b{display:block;font-size:17px}
.tsec .root span{font-size:13px;color:var(--dim)}
.tsec .kids{position:relative;margin-left:19px;padding-left:22px;border-left:3px solid var(--line)}
.leaf{position:relative;display:flex;align-items:center;gap:10px;padding:7px 0;width:100%;background:none;border:0;text-align:left;color:var(--ink)}
.leaf::before{content:'';position:absolute;left:-22px;top:50%;width:18px;border-top:3px solid var(--line)}
.leaf .lc{position:relative;width:44px;height:44px;flex:none}
.leaf .lc svg.ring{position:absolute;inset:0;width:44px;height:44px}
.leaf .lc .core{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;color:#fff}
.leaf .lc .core svg.i{width:18px;height:18px;stroke-width:2.8}
.leaf .lt{flex:1;min-width:0}
.leaf .lt b{display:block;font-size:15px}
.leaf .lt span{font-size:12.5px;color:var(--dim)}
.chip-s{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.chip-s.new{background:var(--blue-bg);color:var(--blue-d)}
.chip-s.learn{background:#FFF0D5;color:var(--orange-d)}
.chip-s.strong{background:var(--green-bg);color:var(--green-d)}
.chip-s.plan{background:var(--soft);color:var(--dimmer)}
.leaf.planned .lc .core{background:#fff;border:2px dashed #D0D0D0;color:#C8C8C8}
.leaf.planned b{color:#A0A0A0}

/* rules */
.ref{font-size:15px}
.rule, .ref{line-height:1.45}
.rule table,.ref table{border-collapse:separate;border-spacing:0;width:100%;margin:10px 0;font-size:14.5px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.rule td,.rule th,.ref td,.ref th{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.rule tr:last-child td,.ref tr:last-child td,.ref tr:last-child th{border-bottom:0}
.rule th,.ref th{background:var(--soft);font-weight:900}
.rule ul{padding-left:20px} .rule li{margin-bottom:6px}
.rule i,.ref i{color:var(--blue-d);font-style:normal;font-weight:800}
.ref h3{font-size:16px;margin:14px 0 4px}
.acc{border:2px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.acc summary .dot svg.i{width:20px;height:20px}
.acc summary b{flex:1;font-size:16px}
.acc summary .chev{color:var(--dimmer);transition:transform .2s}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc .body{padding:0 14px 12px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.prog{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.6,1);position:relative}
.prog i::after{content:'';position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--orange);display:flex;align-items:center;gap:2px;font-size:15px;min-width:38px}
.combo svg{width:20px;height:20px}
.qwrap{flex:1;padding:6px 16px 20px;overflow-y:auto}
.qkicker{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.qkicker.again{color:var(--orange)}
.qtitle{font-family:'Baloo 2';font-weight:800;font-size:25px;line-height:1.15;margin:0 0 14px;color:var(--ink2)}
.speaker{display:flex;align-items:flex-end;gap:8px;margin-bottom:20px}
.speaker svg.m{width:96px;height:96px;flex:none;margin-bottom:-4px}
.sb{position:relative;flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;font-weight:800;line-height:1.35;color:var(--ink2)}
.sb::before{content:'';position:absolute;left:-8px;bottom:22px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.sb small{display:block;color:var(--dim);font-size:14.5px;font-weight:700;margin-top:6px}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--dimmer);margin:0 2px}
.rlink{background:none;border:0;color:var(--blue);font-weight:900;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:4px;padding:0}
.rlink svg.i{width:16px;height:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts{gap:8px!important}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);background:#fff;padding:9px 14px;font-size:16.5px;font-weight:800;color:var(--ink2);width:100%}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--dimmer);flex:none}
.opt.sel{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue-d)}
.opt.sel .k{border-color:var(--blue-line);color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
.opt.right .k{border-color:var(--green);color:var(--green-d)}
.opt.wrongsel{border-color:var(--red);background:var(--red-bg);color:var(--red-d)}
.opt.wrongsel .k{border-color:var(--red);color:var(--red-d)}
.answer-line{min-height:122px;background:repeating-linear-gradient(to bottom,transparent 0 58px,var(--line) 58px 60px);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 6px;align-content:flex-start;padding:9px 0;margin-bottom:24px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;padding:8px 13px 9px;font-size:17.5px;font-weight:800;color:var(--ink2);animation:pop .16s}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);animation:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;padding:9px 12px;font-size:18px;font-weight:800;color:var(--ink2)}
.chip.sel{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue-d)}
.chip.right{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
.chip.wrongsel{border-color:var(--red);background:var(--red-bg);color:var(--red-d)}
.typein{width:100%;border:2px solid var(--line);border-radius:var(--r);background:var(--soft);padding:14px 16px;font-size:20px;font-family:inherit;font-weight:800;color:var(--ink2);outline:none}
.typein:focus{border-color:var(--blue-line);background:#fff}
.typein.right{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
.typein.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-d)}
.hint{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:5px 10px;font-size:14px;color:var(--dim);margin-bottom:12px}
.hint b{color:var(--ink2)}
.lfoot{padding:16px 16px calc(16px + var(--safe-b));border-top:2px solid var(--line);background:#fff}
.lfoot.right{background:var(--green-bg);border-color:transparent}
.lfoot.wrong{background:var(--red-bg);border-color:transparent}
.fb{display:none;margin-bottom:14px}
.lfoot.right .fb,.lfoot.wrong .fb{display:flex;gap:12px;animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.fb .badge{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.fb .badge svg.i{width:26px;height:26px;stroke-width:3.4}
.lfoot.right .badge{color:var(--green)} .lfoot.wrong .badge{color:var(--red)}
.fb .tx{flex:1;min-width:0}
.fb-title{font-family:'Baloo 2';font-weight:800;font-size:22px;line-height:1.1}
.lfoot.right .fb-title,.lfoot.right .fb-ans{color:var(--green-d)}
.lfoot.wrong .fb-title,.lfoot.wrong .fb-ans{color:var(--red-d)}
.fb-ans{font-weight:900;font-size:16.5px;margin-top:3px}
.fb-exp{font-size:14.5px;margin-top:5px;color:var(--ink2);font-weight:700;line-height:1.35}
.fb-tools{display:flex;gap:14px;margin-top:8px}
.fb-tools button{background:none;border:0;padding:0;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;display:flex;gap:4px;align-items:center}
.fb-tools svg.i{width:15px;height:15px}
.lfoot.right .fb-tools button{color:var(--green-d)} .lfoot.wrong .fb-tools button{color:var(--red-d)}

/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
.done svg.m{width:150px;height:150px;animation:jump 1s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.done h1{font-family:'Baloo 2';color:var(--gold);font-size:34px;margin:8px 0 22px;text-shadow:0 2px 0 var(--gold-d)}
.tiles3{display:flex;gap:10px;width:100%;max-width:380px;margin-bottom:20px}
.t3{flex:1;border:2px solid;border-radius:var(--r);overflow:hidden}
.t3 .h{color:#fff;font-weight:900;font-size:11px;padding:5px;text-transform:uppercase;letter-spacing:.5px}
.t3 .v{font-size:22px;font-weight:900;padding:12px 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.t3 .v svg{width:22px;height:22px}
.recap{width:100%;max-width:380px;text-align:left;margin-bottom:20px}
.recap h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px}
.recap div{border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:14.5px}
.recap div b{color:var(--green-d)}
.done .btn{max-width:380px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
.overlay.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:0 18px calc(22px + var(--safe-b));animation:slideup .2s ease-out}
.shead{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;gap:4px;margin:0 -18px 10px;padding:10px 8px 8px;border-bottom:2px solid var(--line)}
.shead .iconbtn{color:var(--ink2);padding:8px}
.shead .iconbtn svg.i{width:28px;height:28px}
.shead h2{flex:1;min-width:0;margin:0!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet h2{font-family:'Baloo 2';margin:0 0 2px;font-size:24px;line-height:1.15}
.steps{margin:6px 0 10px;padding-left:22px;font-size:14px;line-height:1.45;color:var(--ink2)}
.steps li{margin-bottom:6px}
.setrow .steps b,.setrow p b{display:inline;margin:0}
.steps code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:13px}
.setrow textarea{width:100%;height:90px;font:12px/1.3 monospace;border:2px solid var(--line);border-radius:10px;padding:8px}
.warn{color:var(--red-d)}
.sheet .sub{color:var(--dim);margin-bottom:14px}
.sheet .btn{margin-top:10px}
.unit-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.unit-stats div{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.unit-stats b{display:block;font-family:'Baloo 2';font-size:20px}
.unit-stats span{font-size:11px;color:var(--dim);text-transform:uppercase}
.setrow{border-top:2px solid var(--line);padding:14px 0}
.setrow b{display:block;margin-bottom:4px}
.setrow p{margin:0 0 10px;color:var(--dim);font-size:14px}
.setrow .btn{margin-top:8px}
.flaglist{font-size:14px;background:var(--soft);border-radius:12px;padding:10px;white-space:pre-wrap;max-height:160px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px);transform:translateX(-50%);background:var(--ink2);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.floaty{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="top">
    <div class="brand"><span id="brandMascot"></span>Gramadeg</div>
    <div class="stats-row">
      <div class="goal" id="goalRing" title="Daily goal"></div>
      <div class="stat-pill flame" id="streakPill"></div>
      <div class="stat-pill xp" id="xpPill"></div>
      <button class="iconbtn" id="setBtn" aria-label="Settings"></button>
    </div>
  </div>
  <div class="tab on" id="tab-learn"></div>
  <div class="tab" id="tab-practice"></div>
  <div class="tab" id="tab-insights"></div>
  <div class="tab" id="tab-map"></div>
  <div class="tab" id="tab-rules"></div>
  <nav class="nav"><div class="nav-in" id="nav"></div></nav>
</section>

<!-- LESSON -->
<section class="screen" id="lesson">
  <div class="lbar">
    <button class="iconbtn" id="quitBtn" aria-label="Quit"></button>
    <div class="prog"><i id="progFill"></i></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="qwrap" id="qwrap"></div>
  <div class="lfoot" id="lfoot">
    <div class="fb">
      <div class="badge" id="fbBadge"></div>
      <div class="tx">
        <div class="fb-title" id="fbTitle"></div>
        <div class="fb-ans" id="fbAns"></div>
        <div class="fb-exp" id="fbExp"></div>
        <div class="fb-tools"><button id="ruleBtn"></button><button id="flagBtn"></button></div>
      </div>
    </div>
    <button class="btn" id="checkBtn" disabled>Check</button>
  </div>
</section>

<!-- DONE -->
<section class="screen" id="done">
  <div class="done">
    <div id="doneMascot"></div>
    <h1 id="doneTitle">Lesson complete!</h1>
    <div class="tiles3">
      <div class="t3" style="border-color:var(--gold)"><div class="h" style="background:var(--gold)">Total XP</div><div class="v" id="dXp" style="color:var(--gold-d)"></div></div>
      <div class="t3" style="border-color:var(--green)"><div class="h" style="background:var(--green)">Accuracy</div><div class="v" id="dAcc" style="color:var(--green-d)"></div></div>
      <div class="t3" style="border-color:var(--orange)"><div class="h" style="background:var(--orange)">Streak</div><div class="v" id="dStreak" style="color:var(--orange)"></div></div>
    </div>
    <div class="recap" id="recap"></div>
    <button class="btn" id="doneBtn">Continue</button>
  </div>
</section>

<canvas id="confetti"></canvas>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';
const KEY = 'gramadeg-v1';
const LESSON_LEN = 10, MIXED_LEN = 15, TEST_LEN = 20, MISTAKE_LEN = 12, DAILY_GOAL = 20;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];
const LOG_MAX = 20000, DAY_MS = 864e5;

/* ================= icons ================= */
const P = {
  speech:'<path d="M4 5h16v10H10l-5 4v-4H4z"/>',
  no:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',

  key:'<circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h9.5M18.5 12v3.5M21.5 12v2.5"/>',

  hash:'<path d="M9.5 4 7.5 20M16.5 4l-2 16M4.5 9h15.5M3.5 15h15.5"/>',
  star:'<path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6-5.38-2.83-5.38 2.83 1.03-6L3.3 9.6l6-.9z" fill="currentColor"/>',
  trophy:'<path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6.5H4.5a3 3 0 0 0 3.3 3.5M16.5 6.5h3a3 3 0 0 1-3.3 3.5M12 14v3.5M8 20.5h8M9.5 17.5h5"/>',

  home:'<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/>',

  map:'<path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/>',
  flame:'<path d="M12.2 2.5c.9 3.6 5.8 5.6 5.8 10.6a6 6 0 0 1-12 0c0-2.6 1.4-4.6 2.6-6.1.4 1.8 1.3 3 2.6 3.3-.3-2.7.1-5.4 1-7.8z" fill="currentColor" stroke="none"/><path d="M12 21a3 3 0 0 1-3-3c0-1.6 1.2-2.6 2-3.8.3 1 .9 1.6 1.6 1.7.2-.8.6-1.6 1.2-2.2.4 1.2 1.2 2.4 1.2 4.3a3 3 0 0 1-3 3z" fill="#FFC800" stroke="none"/>',
  bolt:'<path d="M13.5 2 4.5 13.5h6.5L10 22l9-11.5h-6.5z" fill="currentColor" stroke="none"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>',
  shuffle:'<path d="M3.5 7h3.2c2 0 3.2 1 4.3 2.7l2 3.6c1 1.7 2.3 2.7 4.3 2.7h3.2"/><path d="M3.5 17h3.2c1.4 0 2.4-.5 3.2-1.4M14 8.4c.8-.9 1.8-1.4 3.3-1.4h3.2"/><path d="m17.8 4.3 2.7 2.7-2.7 2.7M17.8 14.3l2.7 2.7-2.7 2.7"/>',
  check:'<path d="M5 12.5 10 17.5 19.5 7"/>',
  cross:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  flag:'<path d="M5.5 21V4h11.5l-2.2 4 2.2 4H5.5"/>',
  repeat:'<path d="M4.5 12a7.5 7.5 0 0 1 13-5.1l2 2"/><path d="M19.5 4.5v4.4h-4.4"/><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1l-2-2"/><path d="M4.5 19.5v-4.4h4.4"/>',
  chev:'<path d="m9 5 7 7-7 7"/>',
  play:'<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>',
  layers:'<path d="m12 3.5 9 4.5-9 4.5L3 8z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16 9 4.5 9-4.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chart:'<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>',
  brain:'<path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2.5 4.5A3 3 0 0 0 12 18V6a2.5 2.5 0 0 0-3-1.5z"/><path d="M15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2.5 4.5A3 3 0 0 1 12 18"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  cloud:'<path d="M7 18.5h10.5a4 4 0 0 0 .6-8 6 6 0 0 0-11.5-1.3A4.7 4.7 0 0 0 7 18.5z"/>'
};
const icon = (n, extra='') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${P[n]||''}</svg>`;

/* ================= mascot (original dragon) ================= */
function mascot(mood='happy', cls='m'){
  const mouth = {
    happy:'<path d="M53 64.5q7 6 14 0" stroke="#5A1612" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    cheer:'<path d="M52 62.5q8 11 16 0z" fill="#5A1612"/><path d="M55.5 66.5q4.5 3 9 0" fill="#FF8A80"/>',
    think:'<path d="M55 65.5h10" stroke="#5A1612" stroke-width="2.6" stroke-linecap="round"/>',
    sad:'<path d="M53 67q7-5.5 14 0" stroke="#5A1612" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
  }[mood];
  const arms = mood==='cheer'
    ? '<path d="M36 80q-9-8-8-19" stroke="#D93A31" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M84 80q9-8 8-19" stroke="#D93A31" stroke-width="7" fill="none" stroke-linecap="round"/>'
    : '<path d="M36 82q-7 5-6 12" stroke="#D93A31" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M84 82q7 5 6 12" stroke="#D93A31" stroke-width="7" fill="none" stroke-linecap="round"/>';
  const brows = mood==='think' ? '<path d="M41 31.5l12 2.5M79 31.5l-12 2.5" stroke="#8E211B" stroke-width="2.4" stroke-linecap="round"/>'
              : mood==='sad' ? '<path d="M42 34l11-3M78 34l-11-3" stroke="#8E211B" stroke-width="2.4" stroke-linecap="round"/>' : '';
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">
  <ellipse cx="60" cy="113" rx="30" ry="4.5" fill="#000" opacity=".08"/>
  <path d="M84 96c14 4 24-2 25-14" stroke="#C4312A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M104 80l11-6-3 12z" fill="#C4312A"/>
  <path d="M36 70 9 52l5 13-8 3 11 6-6 7 25 3z" fill="#A9271F"/>
  <path d="M84 70l27-18-5 13 8 3-11 6 6 7-25 3z" fill="#A9271F"/>
  <path d="M15 59l16 10M105 59 89 69" stroke="#8E211B" stroke-width="1.6" opacity=".6"/>
  <ellipse cx="60" cy="86" rx="28" ry="25" fill="#E8453C"/>
  <path d="M32 90a28 25 0 0 0 56 0 28 22 0 0 1-56 0z" fill="#C93A32" opacity=".55"/>
  <ellipse cx="60" cy="91" rx="16.5" ry="16" fill="#FFE1D3"/>
  <path d="M47.5 86h25M46 92h28M48 98h24" stroke="#F3C1AE" stroke-width="2" stroke-linecap="round"/>
  ${arms}
  <ellipse cx="46.5" cy="109" rx="9.5" ry="5" fill="#C4312A"/><ellipse cx="73.5" cy="109" rx="9.5" ry="5" fill="#C4312A"/>
  <path d="M41.5 107.5v3M46.5 107v3.5M51.5 107.5v3M68.5 107.5v3M73.5 107v3.5M78.5 107.5v3" stroke="#FFF2EC" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42 24 37 7l13 11z" fill="#FFC800"/><path d="M78 24l5-17-13 11z" fill="#FFC800"/>
  <path d="M42 24 39 14l4 4z" fill="#E5A500"/><path d="M78 24l3-10-4 4z" fill="#E5A500"/>
  <path d="M55 20l5-9 5 9z" fill="#C4312A"/>
  <circle cx="60" cy="45" r="27.5" fill="#E8453C"/>
  <path d="M33 47a27.5 27.5 0 0 0 54 0 27.5 22 0 0 1-54 0z" fill="#C93A32" opacity=".45"/>
  <ellipse cx="51" cy="28" rx="10" ry="5" fill="#fff" opacity=".18" transform="rotate(-20 51 28)"/>
  <ellipse cx="60" cy="59" rx="15.5" ry="10.5" fill="#F2695F"/>
  <ellipse cx="54.5" cy="56" rx="2" ry="1.5" fill="#8E211B"/><ellipse cx="65.5" cy="56" rx="2" ry="1.5" fill="#8E211B"/>
  <ellipse cx="47.5" cy="41" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="72.5" cy="41" rx="7.5" ry="8.5" fill="#fff"/>
  <circle cx="49" cy="42.5" r="4.6" fill="#2B2B2B"/><circle cx="71" cy="42.5" r="4.6" fill="#2B2B2B"/>
  <circle cx="50.6" cy="40.6" r="1.7" fill="#fff"/><circle cx="72.6" cy="40.6" r="1.7" fill="#fff"/>
  ${brows}
  <circle cx="38" cy="54" r="4.2" fill="#FF8A80" opacity=".55"/><circle cx="82" cy="54" r="4.2" fill="#FF8A80" opacity=".55"/>
  ${mouth}
</svg>`;
}

/* ================= state ================= */
let C = null, S = loadState(), L = null, TAB = 'learn';
function blank(){ return {xp:0, streak:{n:0,last:null}, items:{}, flags:[], sound:true, daily:{date:null,xp:0}, log:[], placed:null}; }
function clean(d){
  // Accept only well-formed data, so a damaged save or odd import can never break the app.
  const b=blank(); if(!d || typeof d!=='object' || Array.isArray(d)) return b;
  const num=(v,def=0)=>Number.isFinite(+v)&&v!==null&&v!==''?Math.max(0,Math.floor(+v)):def;
  const day=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:null;
  b.xp=num(d.xp);
  if(d.streak&&typeof d.streak==='object') b.streak={n:num(d.streak.n), last:day(d.streak.last)};
  if(d.items&&typeof d.items==='object') Object.keys(d.items).forEach(k=>{ const x=d.items[k]; if(!x||typeof x!=='object') return;
    b.items[k]={box:Math.min(num(x.box),INTERVALS.length-1), due:day(x.due), seen:num(x.seen), right:num(x.right), wrong:num(x.wrong), lastWrong:day(x.lastWrong), ft:x.ft?1:0}; });
  if(Array.isArray(d.flags)) b.flags=d.flags.filter(f=>f&&typeof f.id==='string').map(f=>({id:f.id, note:String(f.note||''), given:String(f.given||''), at:day(f.at)}));
  b.sound=d.sound!==false;
  if(d.daily&&typeof d.daily==='object') b.daily={date:day(d.daily.date), xp:num(d.daily.xp)};
  if(Array.isArray(d.log)) b.log=d.log.filter(e=>e&&typeof e.q==='string'&&Number.isFinite(+e.t)).slice(-LOG_MAX)
    .map(e=>({t:+e.t, q:e.q, ok:e.ok?1:0, ms:num(e.ms), a:String(e.a==null?'':e.a).slice(0,80), m:String(e.m||''), r:e.r?1:0, ty:String(e.ty||''), v:String(e.v||''), h:e.h?1:0}));
  b.placed=day(d.placed);
  return b;
}
function loadState(){ try{ return clean(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return blank(); } }
let SAVE_FAIL=false;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); SAVE_FAIL=false; }catch(e){ if(!SAVE_FAIL) toast('Could not save progress on this phone'); SAVE_FAIL=true; } }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function item(id){ return S.items[id] || (S.items[id] = {box:0, due:null, seen:0, right:0, wrong:0, lastWrong:null}); }
const it = id => S.items[id] || {box:0,seen:0,right:0,wrong:0};
const isDue = id => { const x=S.items[id]; return x && x.seen && x.due && x.due<=today(); };
const needsFix = id => { const x=S.items[id]; return x && x.wrong>0 && x.box<3; };
const streakAlive = () => S.streak.last===today() || S.streak.last===addDays(today(),-1);
function dailyXp(){ return S.daily && S.daily.date===today() ? S.daily.xp : 0; }
function addXp(n){ S.xp+=n; if(!S.daily || S.daily.date!==today()) S.daily={date:today(),xp:0}; S.daily.xp+=n; }

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f); return '#'+((1<<24)+(Math.min(255,r)<<16)+(Math.min(255,g)<<8)+Math.min(255,b)).toString(16).slice(1); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }
const built = () => C.units.filter(u=>!u.soon);
const unitOf = id => C.units.find(u=>u.id===id);
const allQs = () => built().flatMap(u=>u.questions.map(q=>Object.assign({unit:u.id},q)));
const unitQs = u => u.questions.map(q=>Object.assign({unit:u.id},q));
function ring(p, col, size=98, w=8, track='#E5E5E5'){
  const r=(size-w)/2, c=2*Math.PI*r, len=Math.max(0,Math.min(1,p))*c;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/>${len>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${len} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}</svg>`;
}
function strength(u){ const qs=u.questions; return qs.length ? qs.reduce((a,q)=>a+Math.min(it(q.id).box,4),0)/(qs.length*4) : 0; }
function uStats(u){ let seen=0,right=0,wrong=0,fix=0,started=0; u.questions.forEach(q=>{const x=it(q.id); if(x.seen)started++; right+=Math.max(0,(x.right||0)-(x.ft?1:0)); wrong+=x.wrong||0; if(needsFix(q.id))fix++;}); const tot=right+wrong; return {started, total:u.questions.length, acc: tot? right/tot : null, right, wrong, fix, strength:strength(u)}; }
function status(u){ const s=uStats(u); if(!s.started) return ['new','New']; if(s.strength>=.75) return ['strong','Strong']; return ['learn', Math.round(s.strength*100)+'%']; }

/* ================= sound ================= */
let AC=null;
function sfx(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const seq = {ok:[[784,0],[1046,.09]], bad:[[233,0],[196,.11]], done:[[523,0],[659,.1],[784,.2],[1046,.3]]}[kind];
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(), g=AC.createGain(); o.type = kind==='bad'?'triangle':'sine'; o.frequency.value=f;
      const t=AC.currentTime+d; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==='bad'?0.12:0.16,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.25);
    });
  }catch(e){}
}

function renderLearn(){
  const wave=[0,55,80,55,0,-25];
  let h='', foundCurrent=false;
  if(!S.placed) h+=`<button class="mode" style="margin-bottom:18px" onclick="startLesson('place')"><div class="ic" style="background:#FF9600;box-shadow:0 4px 0 #CC7800">${icon('bolt')}</div><div class="tx"><b>Already know some Welsh? Placement test</b><span>${built().length*3} hard questions (about 6 min). Units you get fully right are fast-tracked.</span></div></button>`;
  built().forEach((u,ui)=>{
    const sec=C.sections.findIndex(s=>s.id===u.section)+1;
    const dark=shade(u.colour,.8), p=strength(u);
    h+=`<div class="unit-banner" style="background:${u.colour};box-shadow:0 4px 0 ${dark}">
      <div class="meta"><div class="kicker">Section ${sec} · Unit ${ui+1}</div><div class="t">${esc(u.title)}</div><div class="s">${esc(u.subtitle||'')}</div></div>
      <button class="guide" onclick="openUnit('${u.id}')">${icon('book')}Guide</button></div>`;
    const n=Math.max(2,Math.ceil(u.questions.length/5));
    h+=`<div class="path">`;
    const side = ui%2 ? -1 : 1;
    h+=`<div class="deco ${side>0?'l':'r'} floaty">${mascot(ui%3===1?'think':'happy','m')}</div>`;
    for(let j=0;j<=n;j++){
      const trophy = j===n;
      const seg = trophy ? 1 : Math.min(1,Math.max(0,(p - j/n)*n));
      const filled = trophy ? p>=.999 : seg>=.999;
      const cur = !foundCurrent && !filled && p<.75;
      if(cur) foundCurrent=true;
      const bg = filled ? '#FFC800' : u.colour, sh = filled ? '#E5A500' : dark;
      const ic = filled ? (trophy?'trophy':'star') : trophy ? 'trophy' : (cur ? 'play' : (u.icon||'star'));
      const act = trophy ? `openUnit('${u.id}')` : `startLesson('unit','${u.id}')`;
      h+=`<div class="node${trophy?' trophy':''}" style="transform:translateX(${side*wave[j%wave.length]}px)">
        ${!trophy && seg>0 && !filled ? ring(seg,u.colour) : ''}
        ${cur?`<div class="startbubble" style="color:${u.colour}">${p>0?'CONTINUE':'START'}</div>`:''}
        <button style="background:${bg};box-shadow:0 7px 0 ${sh}${cur?`,0 0 0 6px ${u.colour}33`:''}" onclick="${act}" aria-label="${esc(u.title)}">${icon(ic)}</button></div>`;
    }
    h+=`</div>`;
  });
  const soon=C.units.filter(u=>u.soon);
  h+=`<div class="coming"><h3>Coming next</h3>${soon.map(u=>`<div class="soon-row"><div class="lk">${icon('lock')}</div><div><b>${esc(u.title)}</b><span>${esc(u.subtitle)}</span></div></div>`).join('')}</div>`;
  $('tab-learn').innerHTML=h;
}

  const due=allQs().filter(q=>isDue(q.id)).length;
  const started=built().filter(u=>uStats(u).started);
  const fix=allQs().filter(q=>needsFix(q.id)).length;

function qText(q){ return q.type==='mc'?q.prompt : q.type==='tiles'?q.en : q.type==='type'?q.text.replace('___','…')+(q.hint?' ('+q.hint+')':'') : q.sentence; }

/* ================= INSIGHTS ================= */
const VLABEL={weak:'Needs work', shaky:'Shaky', solid:'Solid', nodata:'Too few answers'};
const TLABEL={mc:'Multiple choice', tiles:'Build the sentence', type:'Type the word', error:'Spot the error'};
const pct = v => v==null?'–':Math.round(v*100)+'%';
const secs = ms => ms==null?'–':(ms/1000).toFixed(1)+'s';
function skRow(k){
  const col = {weak:'#FF4B4B',shaky:'#FF9600',solid:'#58CC02',nodata:'#D0D0D0'}[k.verdict];
  const bits=[]; if(k.n) bits.push(pct(k.acc)+' right of '+k.n); bits.push(k.seen+'/'+k.total+' questions seen');
  if(k.speed&&k.speed>1.6) bits.push('slow'); if(k.speed&&k.speed<0.7&&k.verdict==='solid') bits.push('quick');
  if(k.trend!=null&&Math.abs(k.trend)>=0.15) bits.push(k.trend>0?'improving ↑':'slipping ↓');
  if(k.recall!=null&&k.recall<0.5) bits.push('fading');
  return `<div class="sk"><div class="mid"><b>${esc(k.info.title)}</b><small>${esc(k.info.blurb||'')}</small>
    <div class="bar"><i style="width:${k.mastery==null?0:Math.round(k.mastery*100)}%;background:${col}"></i></div>
    <small>${k.mastery==null?'':'<b style="display:inline;font-size:12.5px;color:'+col+'">'+pct(k.mastery)+' mastery</b> · '}${esc(bits.join(' · '))}</small></div>
    <div class="right"><span class="vchip ${k.verdict}">${VLABEL[k.verdict]}</span><button class="btn sm ${k.verdict==='weak'?'red':'ghost'}" onclick="startLesson('skill','${k.id}')">Drill</button></div></div>`;
}
function renderInsights(){
  const M=model(), ks=Object.values(M.K).filter(k=>k.total && built().some(u=>k.qs[0].unit===u.id||k.qs.some(q=>q.unit===u.id)));

  if(!totalN){ $('tab-insights').innerHTML=`<div class="hero">${mascot('think','m')}<div class="say">Answer a few questions and this page will show which grammar you know and which needs work.</div></div>`; return; }
  const wk=Date.now()-7*DAY_MS, w7=M.first.filter(e=>e.t>=wk), fading=items.filter(o=>o.recall!=null&&o.recall<0.5).length;
  const focus=ks.filter(k=>k.verdict==='weak'||k.verdict==='shaky').sort((a,b)=>a.mastery-b.mastery);
  const solid=ks.filter(k=>k.verdict==='solid').sort((a,b)=>b.mastery-a.mastery);
  let h=`<div class="hero">${mascot(focus.length?'think':'happy','m')}<div class="say">${focus.length?`Biggest gap: <b>${esc(focus[0].info.title)}</b>. ${fading?fading+' question'+(fading>1?'s are':' is')+' probably fading from memory.':''}`:'No weak spots found yet. Keep going and this gets sharper.'}</div></div>
  <div class="card sumgrid">
    <div><b>${totalN}</b><span>Answers</span></div><div><b>${pct(totalOk/totalN)}</b><span>Right first time</span></div>
    <div><b>${w7.length?pct(w7.filter(e=>e.ok).length/w7.length):'–'}</b><span>Last 7 days</span></div><div><b>${Object.keys(M.days).length}</b><span>Days practised</span></div>
  </div>
  <button class="mode" onclick="startLesson('smart')"><div class="ic" style="background:#58CC02;box-shadow:0 4px 0 #46A302">${icon('brain')}</div><div class="tx"><b>Smart practice</b><span>15 questions aimed at the gaps below.</span></div></button>`;
  h+=`<div class="sec-h">Where to focus</div><div class="card">${focus.length?focus.slice(0,6).map(skRow).join(''):'<p class="note">Nothing below 80% yet.</p>'}</div>`;
  if(solid.length) h+=`<div class="sec-h">You're solid on</div><div class="card solidwrap">${solid.map(k=>`<span class="vchip solid">${esc(k.info.title)} ${pct(k.mastery)}</span>`).join('')}</div>`;
  if(M.conf.length){
    h+=`<div class="sec-h">Mistakes you repeat</div><div class="card">`;
    M.conf.slice(0,8).forEach(c=>{ h+=`<div class="conf">${c.n>1?`<span class="n">×${c.n}</span>`:''}<div>${esc(qText(c.q))}</div>${c.q.type==='error'?'You tapped':'You put'} <span class="x">${esc(c.given)}</span> · answer <span class="y">${esc(correctText(c.q))}</span></div>`; });
    h+=`</div>`;
  }
  h+=`<div class="sec-h">By question type</div><div class="card">`+Object.keys(TLABEL).filter(t=>M.types[t].n).map(t=>`<div class="trow"><span>${TLABEL[t]}</span><span>${pct(M.types[t].acc)} · ${M.types[t].n} · typical ${secs(M.types[t].med)}</span></div>`).join('')+
    `<p class="note">Typing is the truest test: you can't recognise your way to the answer.</p></div>`;
  h+=`<div class="sec-h">Last 4 weeks</div><div class="card">${activitySvg(M.days)}<p class="note">Bar height = answers that day. Colour = accuracy (green 85%+, orange 65%+, red below).</p></div>`;

  });
  h+=`<div class="sec-h">How this works</div><div class="card"><p class="note" style="margin:0">Every answer is logged with the time, what you put and how long you took. Each question gets a memory estimate that grows when you're right and drops when you're wrong, then fades over time. Each skill's mastery blends recent accuracy (older answers count less) with how well you're likely to remember it now. Slow correct answers count as less secure. Lessons and Smart practice pick the questions you most need, plus a few spot-checks of things you seem to know.</p>
    <button class="btn blue" onclick="copyReport()">${icon('copy')}Copy report for Claude</button><p class="note">Paste it to Claude to get new questions aimed at your weak spots.</p></div>`;
  $('tab-insights').innerHTML=h;
}
function activitySvg(days){
  const W=340,H=90,n=28,bw=W/n; let mx=1; const ds=[];
  for(let i=n-1;i>=0;i--){ const k=dayKey(Date.now()-i*DAY_MS); const d=days[k]||{n:0,ok:0}; ds.push(d); mx=Math.max(mx,d.n); }
  return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto" role="img" aria-label="Answers per day, last 28 days">`+ds.map((d,i)=>{
    const h=d.n?Math.max(4,d.n/mx*H):2, a=d.n?d.ok/d.n:0, c=!d.n?'#E5E5E5':a>=.85?'#58CC02':a>=.65?'#FF9600':'#FF4B4B';
    return `<rect x="${i*bw+1.5}" y="${H-h}" width="${bw-3}" height="${h}" rx="2.5" fill="${c}"><title>${d.n} answers${d.n?', '+Math.round(a*100)+'% right':''}</title></rect>`;
  }).join('')+`<text x="0" y="${H+14}" font-size="10" fill="#777">4 weeks ago</text><text x="${W}" y="${H+14}" font-size="10" fill="#777" text-anchor="end">today</text></svg>`;
}
function reportText(){
  const M=model(), ks=Object.values(M.K).filter(k=>k.n), items=Object.values(M.I);
  const tn=items.reduce((a,o)=>a+o.n,0), tok=items.reduce((a,o)=>a+o.ok,0);

  const by=v=>ks.filter(k=>k.verdict===v).sort((a,b)=>a.mastery-b.mastery);

  t+=`\nNEEDS WORK\n${by('weak').map(line).join('\n')||'- none'}\n\nSHAKY\n${by('shaky').map(line).join('\n')||'- none'}\n\nSOLID\n${by('solid').map(line).join('\n')||'- none'}\n`;
  t+=`\nBY QUESTION TYPE\n`+Object.keys(TLABEL).filter(x=>M.types[x].n).map(x=>`- ${TLABEL[x]}: ${pct(M.types[x].acc)} of ${M.types[x].n}, typical ${secs(M.types[x].med)}`).join('\n')+'\n';
  if(M.conf.length) t+=`\nREPEATED / RECENT CONFUSIONS\n`+M.conf.slice(0,15).map(c=>`- ${c.q.id} "${qText(c.q)}": I put "${c.given}" (${c.n}x), answer "${correctText(c.q)}"`).join('\n')+'\n';

}

/* ================= the learner model =================
   Every answer is logged (time, answer given, speed, mode). From that log the app builds:
   - a memory estimate per question: a half-life that grows with each correct answer and
     shrinks sharply with each wrong one; predicted recall = 2^(-days since last seen / half-life)
   - a mastery score per grammar skill: recent accuracy (older answers count less) blended with
     predicted recall across that skill's questions, plus speed, trend and coverage
   - recurring confusions: the same wrong answer given more than once
   Questions are then chosen by need: low predicted recall and weak skills first. */
let MODEL=null;
const median = a => { if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
const dayKey = t => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const skillsOf = q => (q.skills&&q.skills.length)?q.skills:[q.unit];
function skillInfo(id){ const s=C.skills&&C.skills[id]; if(s) return s; const u=unitOf(id); return {group:'point', title:u?u.title:id, blurb:''}; }
function logAnswer(q, ok, ms, given, retry){
  S.log.push({t:Date.now(), q:q.id, ok:ok?1:0, ms:Math.min(ms,180000), a:String(given||'').slice(0,80), m:L.mode, r:retry?1:0, ty:L.cur&&L.cur.hard?'type':q.type, v:C.version||'', h:L.cur&&L.cur.hard?1:0});
  if(S.log.length>LOG_MAX) S.log.splice(0, S.log.length-LOG_MAX);
  MODEL=null;
}
function model(){
  if(MODEL) return MODEL;
  const now=Date.now(), Q={}; allQs().forEach(q=>Q[q.id]=q);
  const first=S.log.filter(e=>!e.r && Q[e.q]);
  const typeMed={}; ['mc','tiles','type','error'].forEach(ty=>{ typeMed[ty]=median(first.filter(e=>e.ty===ty&&e.ok&&e.ms>0).map(e=>e.ms)); });
  const I={};
  const blankItem = () => ({hl:null,last:null,n:0,ok:0,ev:[],speed:[],conf:{},lastOk:null,retries:0,retryOk:0});
  // Older progress from before the log existed: seed from the review box.
  Object.keys(S.items).forEach(id=>{ if(!Q[id]) return; const x=S.items[id]; if(!x.seen) return;
    const logged=first.filter(e=>e.q===id), lr=logged.filter(e=>e.ok).length, lw=logged.length-lr;
    const r=Math.max(0,(x.right||0)-lr), w=Math.max(0,(x.wrong||0)-lw); if(!r&&!w) return;
    const o=I[id]=blankItem(), lastDay=x.due?addDays(x.due,-INTERVALS[x.box]||0):(x.lastWrong||today());
    const t=Date.parse(lastDay+'T12:00:00')||now;
    o.hl=x.ft&&!w?10:([0.4,1,3,7,14,30,60][x.box]||1); o.last=t; o.n=r+w; o.ok=r; o.lastOk=x.box>0;
    for(let k=0;k<w;k++) o.ev.push({t,ok:0}); for(let k=0;k<r;k++) o.ev.push({t,ok:1});
  });
  S.log.forEach(e=>{ const q=Q[e.q]; if(!q) return; const o=I[e.q]||(I[e.q]=blankItem());
    if(!e.ok && e.a) o.conf[e.a]=(o.conf[e.a]||0)+1;
    if(e.r){ o.retries++; if(e.ok) o.retryOk++; return; }
    const med=typeMed[e.ty]; const rel = med&&e.ms ? e.ms/med : 1;
    if(e.ok){ o.speed.push(rel); const f = rel>1.8?1.5 : rel<0.6?2.8 : 2.2;
      if(o.hl==null && !o.n) o.hl = (e.ty==='type'||e.h) ? (rel>1.8?3:6) : (rel>1.8?2:4);
      else o.hl=Math.min(180,(o.hl||0.7)*f*(e.h?1.3:1)); }
    else o.hl=Math.max(0.3,(o.hl||1)*0.35);
    o.last=e.t; o.n++; o.ok+=e.ok; o.lastOk=!!e.ok; o.ev.push({t:e.t, ok:e.ok});
  });
  Object.values(I).forEach(o=>{ o.recall = o.last&&o.hl ? Math.pow(2, -Math.max(0,now-o.last)/DAY_MS/o.hl) : null; if(o.recall!=null && o.lastOk===false) o.recall=Math.min(o.recall,0.3); o.slow=median(o.speed); });
  // skills
  const K={};
  allQs().forEach(q=>skillsOf(q).forEach(sk=>{ (K[sk]||(K[sk]={id:sk, qs:[]})).qs.push(q); }));
  Object.values(K).forEach(k=>{
    let w=0,wok=0,n=0,ok=0,rec=[],seen=0,spd=[]; const ev=[];
    k.qs.forEach(q=>{ const o=I[q.id]; if(!o||!o.n) return; seen++; n+=o.n; ok+=o.ok; if(o.recall!=null) rec.push(o.recall); spd.push(...o.speed);
      o.ev.forEach(e=>{ const wt=Math.pow(0.5,(now-e.t)/DAY_MS/21); w+=wt; wok+=wt*e.ok; ev.push(e); }); });
    ev.sort((a,b)=>a.t-b.t);
    const acc=(wok+1)/(w+2), recall=rec.length?rec.reduce((a,b)=>a+b,0)/rec.length:null;
    k.n=n; k.ok=ok; k.seen=seen; k.total=k.qs.length; k.cover=seen/k.qs.length; k.acc=n?ok/n:null; k.recall=recall;
    k.speed=spd.length>=3?median(spd):null;
    k.mastery = n ? 0.55*acc + 0.45*(recall==null?acc:recall) : null;
    const last=ev.slice(-8), prev=ev.slice(-16,-8), ra=a=>a.length?a.reduce((x,e)=>x+e.ok,0)/a.length:null;
    k.trend = last.length>=4&&prev.length>=4 ? ra(last)-ra(prev) : null;
    k.verdict = n<4 ? 'nodata' : k.mastery<0.6 ? 'weak' : (k.mastery<0.8 || n<6 || (k.speed&&k.speed>1.6)) ? 'shaky' : 'solid';
    k.info=skillInfo(k.id);
  });
  // confusions
  const conf=[];
  Object.keys(I).forEach(id=>{ const o=I[id]; Object.keys(o.conf).forEach(a=>{ conf.push({q:Q[id], given:a, n:o.conf[a]}); }); });
  conf.sort((a,b)=>b.n-a.n);
  // activity and by type
  const days={}; first.forEach(e=>{ const d=dayKey(e.t); const x=days[d]||(days[d]={n:0,ok:0}); x.n++; x.ok+=e.ok; });
  const types={}; ['mc','tiles','type','error'].forEach(ty=>{ const es=first.filter(e=>e.ty===ty); types[ty]={n:es.length, acc:es.length?es.filter(e=>e.ok).length/es.length:null, med:typeMed[ty]}; });
  MODEL={I,K,conf,days,types,first,typeMed};
  return MODEL;
}
function skillMastery(q){ const K=model().K; const ms=skillsOf(q).map(s=>K[s]&&K[s].mastery).filter(v=>v!=null); return ms.length?Math.min(...ms):null; }
function need(q){
  const o=model().I[q.id], sm=skillMastery(q), weak = 1-(sm==null?0.5:sm);
  if(!o||!o.n) return 0.45 + 0.25*weak;
  return 0.6*(1-(o.recall==null?0.5:o.recall)) + 0.3*weak + (o.lastOk===false?0.15:0) + (o.slow&&o.slow>1.6?0.05:0);
}
const bestOf = (pool,n) => pool.map(q=>({q,p:need(q)+Math.random()*0.12})).sort((a,b)=>b.p-a.p).slice(0,n).map(x=>x.q);
// Mostly the questions you most need, plus some spot-checks of things you seem to know.
function pickMix(pool, n){
  if(pool.length<=n) return pool.slice();
  const k=Math.max(1,Math.round(n*0.75)), top=bestOf(pool,k), rest=shuffle(pool.filter(q=>!top.includes(q)));
  return top.concat(rest.slice(0,n-k));
}
function roundRobin(units, n, filter=()=>true){
  const lists=units.map(u=>bestOf(unitQs(u).filter(filter), 99)).filter(l=>l.length);
  const out=[]; let i=0;
  while(out.length<n && lists.some(l=>l.length)){ const l=lists[i%lists.length]; if(l.length) out.push(l.shift()); i++; }
  return out;
}
function mistakePool(uid){
  const pool=(uid?unitQs(unitOf(uid)):allQs()).filter(q=>needsFix(q.id));
  const pr=q=>{ const x=it(q.id); const rate=x.wrong/Math.max(1,x.seen); const recent=x.lastWrong? Math.max(0,30-(Date.parse(today())-Date.parse(x.lastWrong))/864e5)/30 : 0; return rate+recent*.5+(3-x.box)*.2; };
  return pool.sort((a,b)=>pr(b)-pr(a)).slice(0, MISTAKE_LEN);
}
/* ================= adaptive difficulty =================
   - Placement test: 3 hard questions per unit. All right = unit fast-tracked: its unseen
     questions are credited and scheduled for a spot-check review over the next 1-2 weeks.
   - Test out: 8 hard questions from one unit, pass at 7+.
   - Challenge: on skills you're solid on, multiple choice becomes type-the-answer.
   - Follow-ups: get one wrong and a different question on the same skill is added. */
const ENGLISH = /\b(it|the|is|isn't|was|as|started|walking|rain|cold)\b/i;
function typeable(q){ if(q.type!=='mc') return false; const a=q.options[q.answer]; return a.split(' ').length<=4 && !ENGLISH.test(a); }
function hardness(q){ return q.type==='type'?3 : q.type==='tiles'||q.type==='error'||typeable(q)?2 : 1; }
function challenge(q, retry){
  if(retry || !typeable(q)) return false;
  if(L && (L.mode==='place'||L.mode==='testout')) return true;
  const sm=skillMastery(q), o=model().I[q.id];
  return (sm!=null && sm>=0.8) || !!(o && o.lastOk && o.recall!=null && o.recall>0.8);
}
function hardPick(u, n){
  const qs=shuffle(unitQs(u)).sort((a,b)=>(!!it(a.id).seen-!!it(b.id).seen) || (hardness(b)-hardness(a)));
  const out=[], used=new Set();
  qs.forEach(q=>{ const k=skillsOf(q)[0]; if(out.length<n && !used.has(k)){ out.push(q); used.add(k); } });
  qs.forEach(q=>{ if(out.length<n && !out.includes(q)) out.push(q); });
  return out;
}
function fastTrack(u){
  let n=0;
  unitQs(u).forEach((q,i)=>{ const x=S.items[q.id]; if(x&&x.seen) return;
    S.items[q.id]={box:3, due:addDays(today(), 3+(i%10)), seen:1, right:1, wrong:0, lastWrong:null, ft:1}; n++; });
  MODEL=null; return n;
}
function followUp(q){
  if(!L || ['test','place','testout','mistakes'].includes(L.mode) || (L.probes||0)>=3) return;
  const sk=skillsOf(q)[0], have=new Set(L.asked.concat(L.queue.map(x=>x.q.id)));
  const pool=allQs().filter(x=>x.id!==q.id && !have.has(x.id) && skillsOf(x).includes(sk));
  const pick=bestOf(pool,1)[0]; if(!pick) return;
  L.queue.splice(Math.min(2,L.queue.length),0,{q:pick,retry:false,probe:sk}); L.total++; L.probes=(L.probes||0)+1;
}
function startLesson(mode, uid){
  if(!C) return;
  if((mode==='unit'||mode==='test'||mode==='testout') && !unitOf(uid)) return;
  let qs=[], label='';
  if(mode==='unit'){ const u=unitOf(uid); qs=pickMix(unitQs(u),LESSON_LEN); label=u.title; }
  else if(mode==='smart'){ const us=built().filter(u=>uStats(u).started); qs=pickMix((us.length?us:built().slice(0,1)).flatMap(unitQs), MIXED_LEN); label='Smart practice'; }
  else if(mode==='skill'){ qs=pickMix(allQs().filter(q=>skillsOf(q).includes(uid)), LESSON_LEN); label=skillInfo(uid).title; }
  else if(mode==='test'){ const u=unitOf(uid); qs=unitQs(u); label=u.title+': unit test'; }
  else if(mode==='due'){ qs=bestOf(allQs().filter(q=>isDue(q.id)),MIXED_LEN); if(!qs.length){ qs=bestOf(allQs().filter(q=>it(q.id).seen),LESSON_LEN); } label='Review'; }
  else if(mode==='mixed'){ qs=roundRobin(built().filter(u=>uStats(u).started), MIXED_LEN); label='Mixed review'; }
  else if(mode==='all'){ qs=roundRobin(shuffle(built()), TEST_LEN); label='Full test'; }
  else if(mode==='mistakes'){ qs=mistakePool(uid); label='Fix mistakes'; }
  else if(mode==='place'){ qs=built().flatMap(u=>hardPick(u,3)); label='Placement test'; }
  else if(mode==='testout'){ const u=unitOf(uid); qs=hardPick(u,Math.min(8,u.questions.length)); label=u.title+': test out'; }
  if(!qs.length){ toast(mode==='mistakes'?'No mistakes to fix':'Nothing to practise yet'); return; }
  // Take the place of an open sheet in the back-button history, or add a new step.
  if($('overlay').classList.contains('on')){ $('overlay').classList.remove('on'); try{ history.replaceState({layer:'lesson'},''); }catch(e){} }
  else { try{ history.pushState({layer:'lesson'},''); }catch(e){} }
  if(mode!=='place') qs=shuffle(qs);
  L={asked:[], probes:0, mode, uid, label, queue:qs.map(q=>({q,retry:false})), total:qs.length, done:0, firstRight:0, firstTotal:0, combo:0, best:0, missed:[], xp:0};
  show('lesson'); next();
}
