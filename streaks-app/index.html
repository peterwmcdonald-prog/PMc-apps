<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streaks">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7F7EC">
<title>Streaks</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E7F7EC;
    --card: #FFFFFF;
    --card-border: #CFEBDA;
    --track: #DDF2E4;
    --ink: #223020;
    --ink-dim: #7C9C86;
    --ink-dimmer: #B7D9C2;

    --orange: #FF9600;
    --orange-dark: #E07C00;
    --green: #58CC02;
    --green-dark: #46A302;

    --h1: #FF4B6E; --h1-dark:#D63B5A;
    --h2: #1CB0F6; --h2-dark:#0D8FCE;
    --h3: #A560F0; --h3-dark:#8347C9;
    --h4: #2DD4BF; --h4-dark:#1FB3A0;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif; overflow-x:hidden;}
  body{ padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .wrap{max-width:520px; margin:0 auto; padding:18px 16px 90px;}

  /* HEADER */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .brand{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .kudos-pill{
    display:flex; align-items:center; gap:6px;
    background:#fff; border:2px solid var(--card-border);
    padding:7px 14px 9px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;
    color:var(--orange-dark);
    box-shadow: 0 3px 0 var(--card-border);
  }
  .kudos-pill.pulse{ animation: kudosPulse .55s ease; }
  @keyframes kudosPulse{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.2); }
    100%{ transform:scale(1); }
  }

  /* DATE NAV */
  .datenav{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:2px solid var(--card-border); border-radius:16px;
    padding:8px 6px; margin-bottom:16px; box-shadow:0 3px 0 var(--card-border);
  }
  .datenav button{
    background:none; border:none; color:var(--ink-dim); font-size:20px; font-weight:800; padding:6px 16px; cursor:pointer; border-radius:10px;
  }
  .datenav button.muted{ opacity:0.3; }
  .datenav .datelabel{ font-weight:800; font-size:14px; text-align:center; flex:1; color:var(--ink); }
  .datenav .datelabel small{ display:block; color:var(--ink-dimmer); font-weight:700; font-size:10.5px; margin-top:1px;}

  /* COMBO BANNER */
  .combo-banner{
    display:none; align-items:center; gap:10px;
    background: linear-gradient(135deg, #FFF1D6, #FFE3B0);
    border:2px solid #FFD37A;
    border-radius:16px; padding:12px 14px; margin-bottom:16px;
    font-size:12.5px; color:var(--orange-dark); font-weight:800;
  }
  .combo-banner.show{ display:flex; }
  .combo-banner b{ font-family:'Baloo 2',sans-serif; font-size:15px; }

  /* DAY PROGRESS */
  .day-progress{
    background:var(--card); border:2px solid var(--card-border); border-radius:16px;
    padding:12px 14px; margin-bottom:16px; box-shadow:0 3px 0 var(--card-border);
  }
  .day-progress-text{ font-weight:800; font-size:13px; color:var(--ink-dim); margin-bottom:8px; }
  .day-progress-text b{ font-family:'Baloo 2',sans-serif; font-size:17px; color:var(--orange-dark); }
  .day-segs{ display:flex; gap:5px; }
  .day-seg{ flex:1; height:10px; border-radius:999px; background:var(--track); transition:background .3s ease; }

  /* HABIT CARDS */
  .habit-list{ display:flex; flex-direction:column; gap:12px; }
  .habit-card{
    position:relative;
    background:var(--card);
    border:2px solid var(--card-border);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    opacity:0; transform:translateY(10px) scale(0.98);
    animation: cardIn .45s cubic-bezier(.2,.9,.3,1.3) forwards;
    box-shadow:0 3px 0 var(--card-border);
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0) scale(1);} }
  .habit-card.done{ border-color: var(--accent); box-shadow:0 3px 0 var(--accent); }

  .badge{
    position:relative; width:54px; height:54px; border-radius:50%; flex-shrink:0;
    background: conic-gradient(var(--accent) calc(var(--progress)*1%), var(--track) 0);
    display:flex; align-items:center; justify-content:center;
    transition: background 0.4s ease;
  }
  .badge-inner{
    width:44px; height:44px; border-radius:50%; background:#fff;
    border:2px solid var(--card-border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  }
  .badge .flame-ico{ font-size:11px; line-height:1; margin-bottom:1px; }
  .badge .streaknum{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--ink); line-height:1;}
  .badge.pulse{ animation: badgePulse .5s ease; }
  @keyframes badgePulse{ 0%{transform:scale(1);} 50%{transform:scale(1.22);} 100%{transform:scale(1);} }

  .streak-pop{
    position:fixed; transform:translate(-50%,-10px);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px; color:var(--orange-dark);
    background:#fff; border:2px solid var(--orange); border-radius:999px; padding:4px 12px;
    white-space:nowrap;
    animation: popFloat 1.1s ease-out forwards; pointer-events:none; z-index:1000;
  }
  @keyframes popFloat{
    0%{ opacity:0; transform:translate(-50%,0) scale(0.7);}
    20%{ opacity:1; transform:translate(-50%,-16px) scale(1.12);}
    80%{ opacity:1; transform:translate(-50%,-30px) scale(1);}
    100%{ opacity:0; transform:translate(-50%,-56px) scale(1);}
  }

  .habit-main{ flex:1; min-width:0; }
  .habit-name{
    font-weight:800; font-size:14px; color:var(--ink);
    background:none; border:none; padding:0; margin:0 0 2px 0; width:100%;
    font-family:'Nunito',sans-serif;
  }
  .habit-name:focus{ outline:none; border-bottom:2px solid var(--accent); }
  .habit-sub{ font-size:11px; color:var(--ink-dim); font-weight:700; }
  .habit-sub b{ color:var(--accent-text, var(--ink)); }

  .habit-control{ flex-shrink:0; display:flex; align-items:center; gap:8px; }

  .btn3d{ border:none; cursor:pointer; transition: transform .07s ease, box-shadow .07s ease; }
  .btn3d:active{ transform:translateY(3px); }

  .bool-toggle{
    width:42px; height:42px; border-radius:13px;
    background:var(--track); color:transparent; font-size:19px; font-weight:900;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 3px 0 var(--card-border);
  }
  .bool-toggle.on{
    background:var(--accent); color:#fff;
    box-shadow:0 3px 0 var(--accent-dark);
  }
  .bool-toggle.on:active{ box-shadow:0 0 0 var(--accent-dark); }
  .bool-toggle:not(.on):active{ box-shadow:0 0 0 var(--card-border); }

  .num-control{ display:flex; align-items:center; gap:4px; }
  .num-btn{
    width:26px; height:26px; border-radius:9px;
    background:var(--track); color:var(--ink); font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 2px 0 var(--card-border);
  }
  .num-btn:active{ box-shadow:0 0 0 var(--card-border); background:var(--accent); color:#fff; }
  .num-val{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; width:32px; text-align:center;
    background:var(--track); border:none; border-radius:8px; color:var(--ink); padding:5px 0;
  }
  .num-val:focus{ outline:2px solid var(--accent); }
  .num-val::placeholder{ color:var(--ink-dimmer); }

  /* confetti */
  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-10px; width:8px; height:14px; opacity:0.95;
    animation: confettiFall 1.4s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(100vh) rotate(540deg); opacity:0.9; }
  }

  /* CALENDAR */
  .cal-card{
    background:var(--card); border:2px solid var(--card-border); border-radius:var(--radius);
    padding:14px 14px 16px; margin-top:22px; box-shadow:0 3px 0 var(--card-border);
  }
  .cal-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:8px; }
  .habit-chip{
    flex-shrink:0; padding:7px 13px; border-radius:999px; font-weight:800; font-size:11.5px;
    background:var(--track); color:var(--ink-dim); white-space:nowrap;
    box-shadow:0 2px 0 var(--card-border);
  }
  .habit-chip.active{ color:#fff; box-shadow:0 2px 0 var(--chip-dark); }
  .habit-chip:active{ transform:translateY(2px); box-shadow:0 0 0 transparent; }

  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-head button{ background:var(--track); border:none; color:var(--ink-dim); width:28px; height:28px; border-radius:9px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 2px 0 var(--card-border); }
  .cal-head button:active{ transform:translateY(2px); box-shadow:0 0 0 transparent; }
  .cal-title{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--ink-dimmer); font-weight:800; padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:var(--ink-dim); cursor:pointer;
    background:var(--track); border:2px solid transparent;
  }
  .cal-cell.empty{ visibility:hidden; cursor:default; }
  .cal-cell.future{ opacity:0.35; cursor:default; }
  .cal-cell{ position:relative; }
  .cal-cell.lvl1{ background:#FFEBC7; color:var(--orange-dark); }
  .cal-cell.lvl2{ background:#FFCF80; color:var(--orange-dark); }
  .cal-cell.lvl3{ background:#FFAE3D; color:#fff; }
  .cal-cell.lvl4{ background:var(--orange); color:#fff; }
  .cal-count{
    position:absolute; top:2px; right:4px; font-size:8.5px; font-weight:900; line-height:1; opacity:0.85;
  }
  .cal-cell.today{ border-color:var(--ink); }
  .cal-cell.selected{ box-shadow:0 0 0 2px var(--ink) inset; }
  .cal-legend{ display:flex; gap:12px; margin-top:12px; font-size:10.5px; color:var(--ink-dim); font-weight:700; flex-wrap:wrap;}
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .cal-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  footer.note{ text-align:center; color:var(--ink-dimmer); font-size:11px; margin-top:16px; font-weight:700;}

  .export-btn{
    display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
    margin-top:10px; padding:12px; border-radius:14px; border:none;
    background:var(--card); color:var(--ink); font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
    box-shadow:0 3px 0 var(--card-border); border:2px solid var(--card-border); cursor:pointer;
  }
  .export-btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--card-border); }
  .data-row{ display:flex; gap:8px; margin-top:14px; }

  /* TAB BAR */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:center; gap:8px;
    background:var(--card); border-top:2px solid var(--card-border);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1; max-width:244px; padding:10px; border-radius:14px; border:none; cursor:pointer;
    background:var(--track); color:var(--ink-dim);
    font-family:'Nunito',sans-serif; font-weight:900; font-size:13.5px;
    box-shadow:0 3px 0 var(--card-border);
  }
  .tabbar button.active{ background:var(--ink); color:#fff; box-shadow:0 3px 0 #000; }
  .tabbar button:active{ transform:translateY(3px); box-shadow:none; }
  .view[hidden]{ display:none; }

  /* PRESS UPS */
  .pu-card{
    background:var(--card); border:2px solid var(--card-border); border-radius:var(--radius);
    padding:14px; margin-bottom:14px; box-shadow:0 3px 0 var(--card-border);
  }
  .pu-title{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px; margin:0 0 2px; }
  .pu-dim{ font-size:11.5px; color:var(--ink-dim); font-weight:700; }
  .pu-best{ display:flex; align-items:baseline; gap:6px; margin:6px 0 8px; }
  .pu-best b{ font-family:'Baloo 2',sans-serif; font-size:34px; line-height:1; color:var(--h4-dark); }
  .pu-bar{ height:12px; border-radius:999px; background:var(--track); overflow:hidden; }
  .pu-bar i{ display:block; height:100%; background:var(--h4); border-radius:999px; transition:width .4s ease; }
  .pu-ex{ padding:12px 0; border-top:2px dashed var(--track); }
  .pu-ex:first-of-type{ border-top:none; }
  .pu-ex-name{ font-weight:900; font-size:14px; }
  .pu-ex-name small{ font-weight:800; font-size:10px; color:#fff; background:var(--ink-dimmer); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:2px; }
  .pu-ex-how{ font-size:11.5px; color:var(--ink-dim); font-weight:700; margin:2px 0 8px; }
  .pu-sets{ display:flex; gap:7px; flex-wrap:wrap; }
  .pu-set{
    min-width:46px; height:40px; padding:0 10px; border-radius:12px;
    background:var(--track); color:var(--ink); font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px;
    box-shadow:0 3px 0 var(--card-border);
  }
  .pu-set.on{ background:var(--h4); color:#fff; box-shadow:0 3px 0 var(--h4-dark); }
  .pu-feel{ display:flex; gap:7px; margin-top:6px; }
  .pu-feel button, .pu-main-btn{
    flex:1; padding:12px 6px; border-radius:14px; border:none;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:13px; color:#fff;
    background:var(--h4); box-shadow:0 3px 0 var(--h4-dark);
  }
  .pu-feel button:disabled, .pu-main-btn:disabled{ opacity:0.35; }
  .pu-feel button[data-feel="easy"]{ background:var(--green); box-shadow:0 3px 0 var(--green-dark); }
  .pu-feel button[data-feel="hard"]{ background:var(--h1); box-shadow:0 3px 0 var(--h1-dark); }
  .pu-main-btn{ width:100%; margin-top:6px; }
  .pu-link{ background:none; border:none; color:var(--ink-dim); font-weight:800; font-size:12px; text-decoration:underline; margin-top:12px; padding:4px; font-family:'Nunito',sans-serif; cursor:pointer; }
  .pu-test-input{ display:flex; align-items:center; gap:8px; }
  .pu-test-input input{ width:70px; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px; border:none; border-radius:12px; background:var(--track); padding:6px 0; color:var(--ink); }
  .pu-test-input .num-btn{ width:40px; height:40px; font-size:20px; }
  .pu-hist{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .pu-hist-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800; color:var(--ink-dim); }
  .pu-hist-row span:first-child{ width:62px; flex-shrink:0; }
  .pu-hist-row .pu-bar{ flex:1; height:9px; }
  .pu-hist-row b{ width:24px; text-align:right; color:var(--ink); }
  .data-row .export-btn{ margin-top:0; }
</style>
</head>
<body>
<div class="wrap">
<div class="view" id="viewHabits">

  <div class="topbar">
    <div class="brand">🔥 Streaks</div>
    <div class="kudos-pill" id="kudosPill">⭐ <span id="kudosVal">0</span></div>
  </div>

  <div class="datenav">
    <button id="prevDay">‹</button>
    <div class="datelabel" id="dateLabel"><span id="dateMain">Today</span><small id="dateSub"></small></div>
    <button id="nextDay">›</button>
  </div>

  <div class="combo-banner" id="comboBanner">
    🎉 <div><b id="comboText">All habits done!</b><br>Full-house streak: <span id="comboStreak">0</span> days</div>
  </div>

  <div class="day-progress" id="dayProgress">
    <div class="day-progress-text" id="dayProgressText"></div>
    <div class="day-segs" id="daySegs"></div>
  </div>

  <div class="habit-list" id="habitList"></div>

  <div class="cal-card">
    <div class="cal-tabs" id="calTabs"></div>
    <div class="cal-head">
      <button id="prevMonth">‹</button>
      <div class="cal-title" id="calTitle">August 2026</div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend"></div>
  </div>

  <div class="data-row">
    <button class="export-btn" id="exportBtn">⬇ CSV</button>
    <button class="export-btn" id="exportJsonBtn">⬇ Backup</button>
    <button class="export-btn" id="importBtn">⬆ Restore</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">

  <footer class="note">Tap a day in the calendar to log it retrospectively. Your data lives only on this device — use Backup to move it elsewhere.</footer>
</div>

<div class="view" id="viewPushups" hidden>
  <div class="topbar">
    <div class="brand">💪 Press ups</div>
    <div class="kudos-pill" id="puLevelPill">Level 1</div>
  </div>
  <div id="puContent"></div>
</div>
</div>

<nav class="tabbar">
  <button id="tabHabits" class="active">🔥 Habits</button>
  <button id="tabPushups">💪 Press ups</button>
</nav>

<div class="confetti-layer" id="confettiLayer"></div>

<script>
const STORAGE_KEY = 'streaksAppData';
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function isToday(dateStr){ return dateStr === todayStr(); }
function isYesterday(dateStr){ return dateStr === addDays(todayStr(), -1); }

const DEFAULT_HABITS = [
  { id:'h1', name:'Welsh', color:'var(--h1)', dark:'var(--h1-dark)', hasNumber:true, unit:'min' },
  { id:'h2', name:'CSHP', color:'var(--h2)', dark:'var(--h2-dark)', hasNumber:true, unit:'min' },
  { id:'h3', name:'OD', color:'var(--h3)', dark:'var(--h3-dark)', hasNumber:false, unit:'' },
  { id:'h4', name:'Press ups', color:'var(--h4)', dark:'var(--h4-dark)', hasNumber:true, unit:'' },
];

const PU_HABIT_ID = 'h4';
function defaultPushups(){ return { level:1, sessions:{}, tests:[], draft:null }; }
let state = { habits: DEFAULT_HABITS, entries: {}, pushups: defaultPushups() };
let selectedDate = todayStr();
let calMonth = new Date();
let calMode = 'all';
let lastKudos = 0;
let justToggledId = null;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isValidDateKey(dateStr){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  if(m < 1 || m > 12) return false;
  const dt = new Date(y, m-1, d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}

// Defensively rebuilds app state from untrusted input (localStorage or an imported backup file).
// Never trusts shapes/types — always falls back to safe defaults for anything malformed.
function sanitizeLoaded(loaded){
  const safe = { habits: DEFAULT_HABITS.map(h=>({...h})), entries: {}, pushups: sanitizePushups(loaded && loaded.pushups) };
  if(!loaded || typeof loaded !== 'object') return safe;

  if(Array.isArray(loaded.habits)){
    safe.habits = DEFAULT_HABITS.map(defaultH=>{
      const saved = loaded.habits.find(h=>h && h.id===defaultH.id);
      if(saved && typeof saved.name === 'string' && saved.name.trim()){
        return { ...defaultH, name: saved.name.trim().slice(0,20) };
      }
      return defaultH;
    });
  }

  if(loaded.entries && typeof loaded.entries === 'object' && !Array.isArray(loaded.entries)){
    const validHabitIds = new Set(safe.habits.map(h=>h.id));
    for(const dateStr of Object.keys(loaded.entries)){
      if(!isValidDateKey(dateStr)) continue;
      const day = loaded.entries[dateStr];
      if(!day || typeof day !== 'object') continue;
      const cleanDay = {};
      for(const habitId of Object.keys(day)){
        if(!validHabitIds.has(habitId)) continue;
        const e = day[habitId];
        if(!e || typeof e !== 'object') continue;
        const cleanEntry = {};
        if(e.done === true) cleanEntry.done = true;
        else if(e.done === false) cleanEntry.done = false;
        if(e.amount !== undefined){
          const n = Number(e.amount);
          if(Number.isFinite(n)) cleanEntry.amount = Math.max(0, n);
        }
        if(Object.keys(cleanEntry).length) cleanDay[habitId] = cleanEntry;
      }
      if(Object.keys(cleanDay).length) safe.entries[dateStr] = cleanDay;
    }
  }
  return safe;
}

function sanitizePushups(pu){
  const safe = defaultPushups();
  if(!pu || typeof pu !== 'object') return safe;
  const int = (v, min, max) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : undefined; };
  safe.level = int(pu.level, 1, PU_MAX_LEVEL) || 1;
  if(pu.sessions && typeof pu.sessions === 'object'){
    for(const dateStr of Object.keys(pu.sessions)){
      const x = pu.sessions[dateStr];
      if(!isValidDateKey(dateStr) || !x || typeof x !== 'object') continue;
      const clean = {
        level: int(x.level, 1, PU_MAX_LEVEL) || 1,
        prevLevel: int(x.prevLevel, 1, PU_MAX_LEVEL) || 1,
        full: int(x.full, 0, 10000) || 0,
        total: int(x.total, 0, 10000) || 0,
        feel: ['easy','right','hard','test'].includes(x.feel) ? x.feel : 'right',
      };
      if(x.test !== undefined){ const t = int(x.test, 0, 1000); if(t !== undefined) clean.test = t; }
      safe.sessions[dateStr] = clean;
    }
  }
  if(Array.isArray(pu.tests)){
    safe.tests = pu.tests
      .filter(t => t && isValidDateKey(t.date) && int(t.max, 0, 1000) !== undefined)
      .map(t => ({ date:t.date, max:int(t.max, 0, 1000) }))
      .sort((a,b) => a.date < b.date ? -1 : 1);
  }
  const d = pu.draft;
  if(d && typeof d === 'object' && isValidDateKey(d.date)){
    const draft = { date:d.date, sets:{}, forceTest: d.forceTest === true };
    if(d.sets && typeof d.sets === 'object'){
      for(const k of Object.keys(d.sets)){
        if(/^[a-z]{1,10}$/.test(k) && Array.isArray(d.sets[k])) draft.sets[k] = d.sets[k].slice(0,10).map(v => v === true);
      }
    }
    const tv = int(d.testVal, 0, 1000); if(tv !== undefined) draft.testVal = tv;
    safe.draft = draft;
  }
  return safe;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const loaded = JSON.parse(raw);
      const clean = sanitizeLoaded(loaded);
      state.habits = clean.habits;
      state.entries = clean.entries;
      state.pushups = clean.pushups;
      saveState(); // persists removal of retired habits (e.g. Flexibility)
    }
  }catch(e){ console.error('load failed — starting from a clean state', e); }
  render();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); alert('Could not save — your browser storage may be full or blocked.'); }
}

function getEntry(dateStr, habitId){
  const day = state.entries[dateStr];
  if(!day) return {};
  return day[habitId] || {};
}
function isDone(dateStr, habitId){ return getEntry(dateStr, habitId).done === true; }
function setDone(dateStr, habitId, done){
  if(!state.entries[dateStr]) state.entries[dateStr] = {};
  const cur = state.entries[dateStr][habitId] || {};
  state.entries[dateStr][habitId] = { ...cur, done };
  saveState();
}
function setAmount(dateStr, habitId, amount){
  if(!state.entries[dateStr]) state.entries[dateStr] = {};
  const cur = state.entries[dateStr][habitId] || {};
  state.entries[dateStr][habitId] = { ...cur, amount };
  saveState();
}

function computeStreak(habitId){
  let cursor = todayStr();
  if(!isDone(cursor, habitId)) cursor = addDays(cursor, -1);
  let streak = 0;
  let guard = 0;
  while(isDone(cursor, habitId)){
    streak++; cursor = addDays(cursor, -1);
    if(++guard > 20000) break; // safety valve against any unforeseen data loop
  }
  return streak;
}
function allDoneOn(dateStr){
  const day = state.entries[dateStr];
  if(!day) return false;
  return state.habits.every(h => isDone(dateStr, h.id));
}
function doneCountOn(dateStr){
  return state.habits.filter(h => isDone(dateStr, h.id)).length;
}
function computeComboStreak(){
  let cursor = todayStr();
  if(!allDoneOn(cursor)) cursor = addDays(cursor, -1);
  let streak = 0;
  let guard = 0;
  while(allDoneOn(cursor)){
    streak++; cursor = addDays(cursor, -1);
    if(++guard > 20000) break;
  }
  return streak;
}
function computeKudos(){
  let total = 0;
  for(const dateStr in state.entries){
    const doneCount = state.habits.filter(h=>isDone(dateStr, h.id)).length;
    total += doneCount;
    if(doneCount === state.habits.length && state.habits.length>0) total += 5;
  }
  return total;
}

function popStreakGain(habitId, streakLen){
  const badge = document.querySelector(`.badge[data-habit="${habitId}"]`);
  if(!badge) return;
  const rect = badge.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'streak-pop';
  pop.textContent = streakLen === 1 ? '🔥 1 day streak!' : `🔥 ${streakLen}-day streak!`;
  pop.style.left = (rect.left + rect.width/2) + 'px';
  pop.style.top = rect.top + 'px';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(), 1150);
}

function fireConfetti(){
  const layer = document.getElementById('confettiLayer');
  const colors = ['#FF9600','#58CC02','#1CB0F6','#FF4B6E','#A560F0','#FFC800'];
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.3)+'s';
    p.style.animationDuration = (1.1+Math.random()*0.6)+'s';
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    layer.appendChild(p);
    setTimeout(()=>p.remove(), 2200);
  }
}

function renderDateNav(){
  const main = document.getElementById('dateMain');
  const sub = document.getElementById('dateSub');
  const next = document.getElementById('nextDay');
  if(isToday(selectedDate)){ main.textContent = 'Today'; }
  else if(isYesterday(selectedDate)){ main.textContent = 'Yesterday'; }
  else { main.textContent = new Date(selectedDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
  sub.textContent = selectedDate;
  next.classList.toggle('muted', isToday(selectedDate));
}

function renderHabits(){
  const list = document.getElementById('habitList');
  list.innerHTML = '';
  state.habits.forEach((habit, idx) => {
    const entry = getEntry(selectedDate, habit.id);
    const done = entry.done === true;
    const streak = computeStreak(habit.id);
    const card = document.createElement('div');
    card.className = 'habit-card' + (done ? ' done':'');
    card.style.setProperty('--accent', habit.color);
    card.style.setProperty('--accent-dark', habit.dark);
    card.style.animationDelay = (idx*0.05)+'s';

    const progress = Math.round(((streak % 7) / 7) * 100) || (streak>0 ? 100 : 0);
    const onFire = streak >= 3;
    const amt = entry.amount;

    card.innerHTML = `
      <div class="badge ${habit.id===justToggledId ? 'pulse' : ''}" data-habit="${habit.id}" style="--progress:${progress}">
        <div class="badge-inner">
          ${onFire ? '<div class="flame-ico">🔥</div>' : ''}
          <div class="streaknum">${streak}</div>
        </div>
      </div>
      <div class="habit-main">
        <input class="habit-name" data-id="${habit.id}" value="${escapeHtml(habit.name)}" maxlength="20" />
        <div class="habit-sub">${streak>0 ? `<b>${streak}</b> day streak` : 'no streak yet'}</div>
      </div>
      <div class="habit-control">
        ${habit.hasNumber ? `
        <div class="num-control">
          <button class="num-btn btn3d" data-id="${habit.id}" data-dir="-1">–</button>
          <input class="num-val" data-id="${habit.id}" type="number" inputmode="numeric" placeholder="–" value="${amt ?? ''}" />
          <button class="num-btn btn3d" data-id="${habit.id}" data-dir="1">+</button>
        </div>` : ''}
        <button class="bool-toggle btn3d ${done?'on':''}" data-id="${habit.id}">✓</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.habit-name').forEach(el=>{
    el.addEventListener('change', e=>{
      const habit = state.habits.find(h=>h.id===e.target.dataset.id);
      habit.name = e.target.value.trim() || habit.name;
      saveState();
      renderCalendar();
    });
  });
  list.querySelectorAll('.bool-toggle').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const wasDone = isDone(selectedDate, id);
      setDone(selectedDate, id, !wasDone);
      const wasAllDone = allDoneOn(selectedDate);
      if(!wasDone){ justToggledId = id; }
      render();
      if(!wasDone) popStreakGain(id, computeStreak(id));
      justToggledId = null;
      if(wasAllDone && isToday(selectedDate)) fireConfetti();
    });
  });
  list.querySelectorAll('.num-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const cur = Number(getEntry(selectedDate,id).amount || 0);
      const next = Math.max(0, cur + parseInt(e.target.dataset.dir));
      setAmount(selectedDate, id, next);
      render();
    });
  });
  list.querySelectorAll('.num-val').forEach(el=>{
    // Save on every keystroke (no re-render — re-rendering here would rebuild the
    // input and kick the user out mid-type). Re-render happens on blur/enter instead,
    // so the streak badge etc. catch up without disrupting typing.
    el.addEventListener('input', e=>{
      const id = e.target.dataset.id;
      const raw = e.target.value;
      const v = raw === '' ? undefined : Math.max(0, Number(raw)||0);
      setAmount(selectedDate, id, v);
    });
    el.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      const raw = e.target.value;
      const v = raw === '' ? undefined : Math.max(0, Number(raw)||0);
      setAmount(selectedDate, id, v);
      render();
    });
  });
}

function renderCombo(){
  const banner = document.getElementById('comboBanner');
  const comboStreak = computeComboStreak();
  if(comboStreak > 0){
    banner.classList.add('show');
    document.getElementById('comboStreak').textContent = comboStreak;
    document.getElementById('comboText').textContent = comboStreak >= 7 ? 'On an amazing run!' : 'All habits done!';
  } else {
    banner.classList.remove('show');
  }
}

function renderCalTabs(){
  const tabs = document.getElementById('calTabs');
  tabs.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'habit-chip' + (calMode==='all' ? ' active' : '');
  allChip.textContent = 'All';
  if(calMode==='all'){ allChip.style.background = 'var(--ink)'; }
  allChip.addEventListener('click', ()=>{ calMode='all'; renderCalTabs(); renderCalendar(); });
  tabs.appendChild(allChip);

  state.habits.forEach(h=>{
    const chip = document.createElement('div');
    chip.className = 'habit-chip' + (calMode===h.id ? ' active' : '');

    chip.style.setProperty('--chip-dark', h.dark);
    if(calMode===h.id){ chip.style.background = h.color; }

function renderCalendar(){
  const title = document.getElementById('calTitle');
  const grid = document.getElementById('calGrid');
  const legend = document.getElementById('calLegend');
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  title.textContent = calMonth.toLocaleDateString(undefined,{month:'long', year:'numeric'});

  const habit = calMode !== 'all' ? state.habits.find(h=>h.id===calMode) : null;

  grid.innerHTML = '';
  ['S','M','T','W','T','F','S'].forEach(d=>{
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = fmtDate(new Date(year, month, d));
    const el = document.createElement('div');
    let cls = 'cal-cell';
    if(dateStr > todayStr()){
      cls += ' future';
    } else if(habit){
      if(isDone(dateStr, habit.id)){
        el.style.background = habit.color;
        el.style.color = '#fff';
      }
    } else {
      const count = doneCountOn(dateStr);
      if(count > 0){
        // Map count onto 4 shade levels so it still works if the habit list changes length.
        const lvl = Math.max(1, Math.ceil(count / state.habits.length * 4));
        cls += ' lvl' + lvl;
      }
    }
    if(dateStr === todayStr()) cls += ' today';
    if(dateStr === selectedDate) cls += ' selected';
    el.className = cls;
    el.textContent = d;
    if(!habit && dateStr <= todayStr()){
      const count = doneCountOn(dateStr);
      if(count > 0){
        const badge = document.createElement('span');
        badge.className = 'cal-count';
        badge.textContent = count;
        el.appendChild(badge);
      }
    }
    if(dateStr <= todayStr()){
      el.addEventListener('click', ()=>{ selectedDate = dateStr; render(); });
    }
    grid.appendChild(el);
  }

  legend.innerHTML = habit
    ? `<span><i style="background:${habit.color}"></i>${habit.name} done</span><span><i style="background:var(--track)"></i>not logged</span>`
    : `<span><i style="background:#FFEBC7"></i>1</span><span><i style="background:#FFCF80"></i>2</span><span><i style="background:#FFAE3D"></i>3</span><span><i style="background:var(--orange)"></i>all ${state.habits.length}</span><span>habits done (number in corner)</span>`;
}

/* ---------- PRESS UPS ----------
   Levels go up slowly (one per good session). Full press up sets grow by one rep
   every 4 levels; knee/negative/variety work builds the strength in between.
   Every 7th session is a test (max full press ups in a row), which re-calibrates
   the level up or down so the plan always matches what you can actually do. */
const PU_GOAL = 50;
const PU_MAX_LEVEL = 200;
const PU_VARIETY = [
  { name:'Wide knee press ups', how:'Knees down, hands wider than your shoulders.' },
  { name:'Diamond incline press ups', how:'Hands close together under your chest, on a table or bench.' },
  { name:'Staggered knee press ups', how:'One hand forward, one back. Swap sides between sets.' },
  { name:'Slow wall press ups', how:'3 seconds down, 3 seconds up. Keep your body straight.' },
  { name:'Stair press ups', how:'Hands on a step. The lower the step, the harder it is.' },
  { name:'Paused knee press ups', how:'Hold for 2 seconds just above the floor, then push up.' },
];
function puFullReps(L){ return 1 + Math.floor((L-1)/4); }
function puLevelForReps(r){ return Math.min(PU_MAX_LEVEL, (Math.max(1, r)-1)*4 + 1); }
function puSessionsBefore(dateStr){ return Object.keys(state.pushups.sessions).filter(d => d < dateStr).length; }
function puDraft(){
  const t = todayStr();
  if(!state.pushups.draft || state.pushups.draft.date !== t) state.pushups.draft = { date:t, sets:{}, forceTest:false };
  return state.pushups.draft;
}
function puBest(){ return state.pushups.tests.reduce((m,t) => Math.max(m, t.max), 0); }
function puPlan(){
  const L = state.pushups.level;
  const r = puFullReps(L);
  const n = puSessionsBefore(todayStr());
  const test = puDraft().forceTest || (n % 7 === 6);
  const ex = [
    { key:'wall', tag:'warm-up', name:'Wall press ups', how:'Hands on the wall at shoulder height, step back, body straight.', sets:[10] },
    { key:'incline', tag:'warm-up', name:'Incline press ups', how:'Hands on the edge of a table or bench.', sets:[8] },
  ];
  if(test){
    ex.push({ key:'test', test:true, name:'Test: full press ups in a row', how:'As many as you can with good form: body straight, chest close to the floor. Stop when your form breaks.' });
  } else {
    ex.push({ key:'full', full:true, name:'Full press ups', how:'Body straight from head to heels, chest about a fist off the floor. Rest 1–2 min between sets.', sets:[r,r,r] });
    if(r <= 8){
      const nr = Math.min(5, 2 + Math.floor(L/10));
      ex.push({ key:'neg', name:'Negatives', how:'From the top of a full press up, lower yourself slowly over 4 seconds. Drop to your knees to get back up.', sets:[nr,nr,nr] });
    }
    const k = Math.min(30, 8 + Math.floor(L/2));
    ex.push({ key:'knee', name:'Knee press ups', how:'Knees down, hips in line with your back. Go all the way down.', sets:[k,k,k] });
  }
  const v = PU_VARIETY[n % PU_VARIETY.length];
  const vr = Math.min(20, 6 + Math.floor(L/6));
  ex.push({ key:'var', tag:'variety', name:v.name, how:v.how, sets:[vr,vr] });
  return { L, r, n, test, ex };
}
function puTally(plan){
  const d = puDraft();
  let full = 0, total = 0, any = false;
  plan.ex.forEach(e=>{
    if(e.test) return;
    const done = d.sets[e.key] || [];
    e.sets.forEach((reps,i)=>{ if(done[i]){ any = true; total += reps; if(e.full) full += reps; } });
  });
  if(plan.test && d.testVal !== undefined){ full += d.testVal; total += d.testVal; any = true; }
  return { full, total, any };
}
function puFinish(feel){
  const t = todayStr();
  const plan = puPlan();
  const d = puDraft();
  const { full, total } = puTally(plan);
  const L = plan.L;
  let newL;
  if(plan.test){
    const M = d.testVal;
    if(M === undefined){ alert('Enter how many you did first.'); return; }
    state.pushups.tests = state.pushups.tests.filter(x => x.date !== t).concat({ date:t, max:M });
    // Train full sets at ~60% of your max. Jump up if you've outgrown the plan, drop down if it's beyond you.
    const target = puLevelForReps(Math.floor(M * 0.6));
    newL = (target > L || plan.r > Math.max(1, M)) ? target : L;
  } else {
    newL = Math.min(PU_MAX_LEVEL, L + ({ easy:2, right:1, hard:0 })[feel]);
  }
  state.pushups.sessions[t] = { level:L, prevLevel:L, full, total, feel: plan.test ? 'test' : feel, ...(plan.test ? { test:d.testVal } : {}) };
  state.pushups.level = newL;
  const wasAllDone = allDoneOn(t);
  setDone(t, PU_HABIT_ID, true);
  setAmount(t, PU_HABIT_ID, full);
  render();
  if(!wasAllDone && allDoneOn(t)) fireConfetti();
  else if(plan.test && puBest() >= PU_GOAL) fireConfetti();
}
function puUndo(){
  const t = todayStr();
  const s = state.pushups.sessions[t];
  if(!s) return;
  state.pushups.level = s.prevLevel;
  delete state.pushups.sessions[t];
  state.pushups.tests = state.pushups.tests.filter(x => x.date !== t);
  setDone(t, PU_HABIT_ID, false);
  setAmount(t, PU_HABIT_ID, undefined);
  render();
}

function renderPushups(){
  const el = document.getElementById('puContent');
  const pu = state.pushups;
  const plan = puPlan();
  const best = puBest();
  const today = pu.sessions[todayStr()];
  document.getElementById('puLevelPill').textContent = 'Level ' + pu.level;

  const toTest = today ? null : (plan.test ? 0 : 6 - (plan.n % 7));
  let html = `
    <div class="pu-card">
      <div class="pu-dim">Goal: ${PU_GOAL} full press ups in a row</div>
      <div class="pu-best"><b>${best}</b><span class="pu-dim">best in a row${pu.tests.length ? '' : ' (no test yet)'}</span></div>
      <div class="pu-bar"><i style="width:${Math.min(100, best/PU_GOAL*100)}%"></i></div>
      <div class="pu-dim" style="margin-top:8px">${Object.keys(pu.sessions).length} session${Object.keys(pu.sessions).length===1?'':'s'} done${toTest === null ? '' : toTest === 0 ? ' · test day today' : ` · test in ${toTest} session${toTest===1?'':'s'}`}</div>
    </div>`;

  if(today){
    html += `
    <div class="pu-card">
      <div class="pu-title">✅ Today's session done</div>
      <div class="pu-dim">${today.test !== undefined ? `Test: <b>${today.test}</b> in a row · ` : ''}${today.full} full · ${today.total} reps in total</div>
      <div class="pu-dim" style="margin-top:6px">Tomorrow: level ${pu.level} — ${puFullReps(pu.level)} full per set</div>
      <button class="pu-link" id="puUndo">Undo</button>
    </div>`;
  } else {
    const d = puDraft();
    html += `<div class="pu-card"><div class="pu-title">${plan.test ? '🏁 Test day' : "Today's session"}</div>
      <div class="pu-dim">${plan.test ? 'Warm up, then see how many you can do.' : 'Tap each set when you finish it. Easier versions are fine on a bad day.'}</div>`;
    plan.ex.forEach(e=>{
      html += `<div class="pu-ex"><div class="pu-ex-name">${e.name}${e.tag ? `<small>${e.tag}</small>` : ''}</div><div class="pu-ex-how">${e.how}</div>`;
      if(e.test){
        html += `<div class="pu-test-input">
          <button class="num-btn btn3d" data-pu-test="-1">–</button>
          <input type="number" inputmode="numeric" id="puTestVal" placeholder="–" value="${d.testVal ?? ''}">
          <button class="num-btn btn3d" data-pu-test="1">+</button></div>`;
      } else {
        const done = d.sets[e.key] || [];
        html += `<div class="pu-sets">${e.sets.map((reps,i)=>`<button class="pu-set btn3d ${done[i]?'on':''}" data-pu-ex="${e.key}" data-pu-i="${i}">${done[i]?'✓ ':''}${reps}</button>`).join('')}</div>`;
      }
      html += `</div>`;
    });
    const { any } = puTally(plan);
    html += plan.test
      ? `<button class="pu-main-btn btn3d" id="puSaveTest" ${d.testVal === undefined ? 'disabled' : ''}>Save result</button>`
      : `<div class="pu-dim" style="margin-top:6px">How did it feel?</div>
         <div class="pu-feel">
           <button class="btn3d" data-feel="hard" ${any?'':'disabled'}>Too hard</button>
           <button class="btn3d" data-feel="right" ${any?'':'disabled'}>Just right</button>
           <button class="btn3d" data-feel="easy" ${any?'':'disabled'}>Easy</button>
         </div>`;
    if(plan.n % 7 !== 6){
      html += `<button class="pu-link" id="puToggleTest">${d.forceTest ? 'Back to normal session' : 'Do a test today instead'}</button>`;
    }
    html += `</div>`;
  }

  if(pu.tests.length){
    const last = pu.tests.slice(-6);
    html += `<div class="pu-card"><div class="pu-title">Tests</div><div class="pu-hist">${last.map(t=>`
      <div class="pu-hist-row"><span>${new Date(t.date+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>
      <div class="pu-bar"><i style="width:${Math.min(100, t.max/PU_GOAL*100)}%"></i></div><b>${t.max}</b></div>`).join('')}</div></div>`;
  }
  html += `<footer class="note">Too hard = same level tomorrow. Just right = up 1. Easy = up 2.<br>Sore or tired? Do the warm-up and variety only — it still counts.</footer>`;
  el.innerHTML = html;

  el.querySelectorAll('.pu-set').forEach(b=>b.addEventListener('click', ()=>{
    const d = puDraft(); const k = b.dataset.puEx; const i = Number(b.dataset.puI);
    d.sets[k] = d.sets[k] || []; d.sets[k][i] = !d.sets[k][i];
    saveState(); renderPushups();
  }));
  el.querySelectorAll('[data-feel]').forEach(b=>b.addEventListener('click', ()=>puFinish(b.dataset.feel)));
  el.querySelectorAll('[data-pu-test]').forEach(b=>b.addEventListener('click', ()=>{
    const d = puDraft(); d.testVal = Math.max(0, (d.testVal ?? 0) + Number(b.dataset.puTest));
    saveState(); renderPushups();
  }));
  const tv = document.getElementById('puTestVal');
  if(tv){
    tv.addEventListener('input', ()=>{
      const d = puDraft(); d.testVal = tv.value === '' ? undefined : Math.max(0, Math.round(Number(tv.value)) || 0);
      saveState();
      document.getElementById('puSaveTest').disabled = d.testVal === undefined;
    });
  }
  const st = document.getElementById('puSaveTest'); if(st) st.addEventListener('click', ()=>puFinish('test'));
  const tt = document.getElementById('puToggleTest'); if(tt) tt.addEventListener('click', ()=>{ const d = puDraft(); d.forceTest = !d.forceTest; saveState(); renderPushups(); });
  const un = document.getElementById('puUndo'); if(un) un.addEventListener('click', puUndo);
}

function showView(name){
  document.getElementById('viewHabits').hidden = name !== 'habits';
  document.getElementById('viewPushups').hidden = name !== 'pushups';
  document.getElementById('tabHabits').classList.toggle('active', name === 'habits');
  document.getElementById('tabPushups').classList.toggle('active', name === 'pushups');
  window.scrollTo(0,0);
}
document.getElementById('tabHabits').addEventListener('click', ()=>showView('habits'));
document.getElementById('tabPushups').addEventListener('click', ()=>showView('pushups'));

function render(){
  renderPushups();
  renderDateNav();
  renderDayProgress();
  renderHabits();
  renderCombo();
  renderKudos();
  renderCalTabs();
  renderCalendar();
}

document.getElementById('prevDay').addEventListener('click', ()=>{
  selectedDate = addDays(selectedDate,-1);
  const d = new Date(selectedDate+'T00:00:00');
  if(d.getMonth()!==calMonth.getMonth() || d.getFullYear()!==calMonth.getFullYear()){ calMonth = d; }
  render();
});
document.getElementById('nextDay').addEventListener('click', ()=>{
  if(isToday(selectedDate)) return;
  selectedDate = addDays(selectedDate,1);
  const d = new Date(selectedDate+'T00:00:00');
  if(d.getMonth()!==calMonth.getMonth() || d.getFullYear()!==calMonth.getFullYear()){ calMonth = d; }
  render();
});
document.getElementById('prevMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); });
document.getElementById('nextMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); });

function exportCSV(){
  const dates = Object.keys(state.entries).sort();
  const header = ['date'];
  state.habits.forEach(h=>{
    header.push(h.name + ' done');
    if(h.hasNumber) header.push(h.name + (h.unit ? ` (${h.unit})` : ' amount'));
  });
  const rows = [header];
  dates.forEach(dateStr=>{
    const row = [dateStr];
    state.habits.forEach(h=>{
      const e = getEntry(dateStr, h.id);
      row.push(e.done === true ? 'yes' : 'no');
      if(h.hasNumber) row.push(e.amount !== undefined ? e.amount : '');
    });
    rows.push(row);
  });
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `streaks-export-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportBtn').addEventListener('click', exportCSV);

function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `streaks-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const loaded = JSON.parse(evt.target.result);
      if(!loaded || typeof loaded !== 'object' || !loaded.entries){
        alert('That file doesn\'t look like a Streaks backup.');
        return;
      }
      const ok = confirm('This will replace all data currently on this device with the backup file. Continue?');
      if(!ok) return;
      const clean = sanitizeLoaded(loaded);
      state.habits = clean.habits;
      state.entries = clean.entries;
      state.pushups = clean.pushups;
      saveState();
      render();
      alert('Backup restored.');
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(()=>{});
  });
}

loadState();
</script>
