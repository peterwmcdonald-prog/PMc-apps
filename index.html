<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F3F4F6">
<title>PMc apps</title>
<link rel="icon" type="image/png" href="cathays-commute/icons/favicon.png">
<style>
  :root{--bg:#F3F4F6;--card:#FFFFFF;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB}
  @media (prefers-color-scheme: dark){:root{--bg:#111827;--card:#1F2937;--ink:#F9FAFB;--muted:#9CA3AF;--line:#374151}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:max(24px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
  .wrap{max-width:480px;margin:0 auto}
  h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 20px;font-size:15px}
  a.app{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:12px 14px;margin-bottom:12px;text-decoration:none;color:inherit}
  a.app img{width:60px;height:60px;border-radius:14px;flex:none}
  .name{font-weight:700;font-size:18px}
  .desc{color:var(--muted);font-size:14px;margin-top:2px}
  .go{margin-left:auto;color:var(--muted);font-size:22px}
  .how{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.5;margin-top:20px}
  .how b{display:block;margin-bottom:4px}
  .how ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>PMc apps</h1>
  <p class="sub">Tap an app to open it.</p>

  <a class="app" href="streaks-app/">
    <img src="streaks-app/icons/icon-192.png" alt="">
    <div><div class="name">Streaks</div><div class="desc">Habit tracker</div></div>
    <span class="go">›</span>
  </a>
  <a class="app" href="gramadeg/">
    <img src="gramadeg/icons/icon-192.png" alt="">
    <div><div class="name">Gramadeg</div><div class="desc">Welsh grammar practice</div></div>
    <span class="go">›</span>
  </a>
  <a class="app" href="cathays-commute/">
    <img src="cathays-commute/icons/icon-192.png" alt="">
    <div><div class="name">Cathays commute</div><div class="desc">Trains to and from Cathays Park</div></div>
    <span class="go">›</span>
  </a>

  <div class="how">
    <b>Add one to your home screen</b>
    <ol>
      <li>Open this page in Safari.</li>
      <li>Tap the app.</li>
      <li>Tap Share, then Add to Home Screen.</li>
      <li>Come back here for the next one.</li>
    </ol>
  </div>
</div>
</body>
</html>
